<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Neocities Game</title>
  <style>
    :root {
      --time-filter: brightness(1) sepia(0) hue-rotate(0deg);
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 800px;
      height: 600px;
      background-color: #2a2a2a;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      filter: var(--time-filter);
      transition: filter 2s ease;
    }
    .scene-object {
      position: absolute;
      user-select: none;
      transform-origin: center center;
    }
    .hitbox {
      /* Invisible in production */
      background-color: transparent;
      border: none;
    }
    /* Animations */
    @keyframes wiggle {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .anim-wiggle { animation: wiggle 0.5s ease-in-out infinite; }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .anim-pulse { animation: pulse 2s infinite; }
    
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(255,255,255,0.5)); }
      50% { filter: drop-shadow(0 0 20px rgba(255,255,255,1)); }
    }
    .anim-glow { animation: glow 2s infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .anim-float { animation: float 3s ease-in-out infinite; }

    /* UI Overlay */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10000;
    }
    
    #dialogue-box {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 20px;
      border-radius: 4px;
      border: 2px solid #fff;
      font-size: 18px;
      pointer-events: auto;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
    }

    #needs-tracker {
      display: block;
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      border: 1px solid #555;
      font-size: 12px;
      pointer-events: auto;
    }
    .need-bar {
      width: 100px; height: 8px; background: #333; margin-top: 2px; margin-bottom: 6px;
    }
    .need-fill {
      height: 100%; background: #4ade80; transition: width 0.3s;
    }

    #flavor-text {
      position: absolute;
      pointer-events: none;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.2s;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      white-space: nowrap;
    }
  </style>
</head>

  <script>
    // Game State
    let state = {
      needs: { rest: 100, hunger: 100, connection: 100, spiritual: 100, novelty: 100 },
      skills: { naturalist: 5, occultist: 2, scribal: 8 },
      inventory: [],
      time: 8 // 0-24
    };

    // Load from LocalStorage
    try {
      const saved = localStorage.getItem('neocities_game_save_80a4883c-dc40-47ca-b326-34d269650480');
      if (saved) {
        state = { ...state, ...JSON.parse(saved) };
      }
    } catch(e) {}

    const saveGame = () => {
      localStorage.setItem('neocities_game_save_80a4883c-dc40-47ca-b326-34d269650480', JSON.stringify(state));
    };

    document.addEventListener('DOMContentLoaded', () => {
      const dialogueBox = document.getElementById('dialogue-box');
      const flavorText = document.getElementById('flavor-text');
      const container = document.getElementById('game-container');
      
      // Update Needs UI
      const updateNeedsUI = () => {
        ['rest', 'hunger', 'connection', 'spiritual', 'novelty'].forEach(need => {
          const el = document.getElementById('need-' + need);
          if (el) el.style.width = Math.max(0, Math.min(100, state.needs[need])) + '%';
        });
      };
      updateNeedsUI();

      // Day/Night Cycle
      

      // Parallax Effect
      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / rect.width - 0.5;
        const mouseY = (e.clientY - rect.top) / rect.height - 0.5;

        document.querySelectorAll('.scene-object').forEach(obj => {
          const speed = parseFloat(obj.getAttribute('data-parallax')) || 1;
          if (speed !== 1) {
            const offset = (speed - 1) * 50; // 50px max offset
            obj.style.transform = `translate(${-mouseX * offset}px, ${-mouseY * offset}px)`;
          }
        });
      });

      // Interactions
      document.querySelectorAll('.scene-object').forEach(obj => {
        
        // Flavor Text on Hover
        obj.addEventListener('mouseenter', (e) => {
          const flavor = obj.getAttribute('data-flavor');
          if (flavor) {
            flavorText.innerText = flavor;
            flavorText.style.opacity = 1;
            const rect = obj.getBoundingClientRect();
            const contRect = container.getBoundingClientRect();
            flavorText.style.left = (rect.left - contRect.left + rect.width/2) + 'px';
            flavorText.style.top = (rect.top - contRect.top) + 'px';
          }
        });
        
        obj.addEventListener('mouseleave', () => {
          flavorText.style.opacity = 0;
        });

        obj.addEventListener('click', (e) => {
          // Skill Check
          const reqSkill = obj.getAttribute('data-skill');
          const diff = parseInt(obj.getAttribute('data-difficulty')) || 0;
          if (reqSkill && reqSkill !== 'none') {
            const roll = Math.floor(Math.random() * 20) + 1 + (state.skills[reqSkill] || 0);
            if (roll < diff) {
              dialogueBox.innerHTML = `[Skill Check Failed] ${reqSkill} roll: ${roll} vs ${diff}`;
              dialogueBox.style.display = 'block';
              setTimeout(() => dialogueBox.style.display = 'none', 3000);
              return;
            }
          }

          // Apply Needs Effect
          try {
            const needsStr = obj.getAttribute('data-needs');
            if (needsStr) {
              const effect = JSON.parse(needsStr);
              let changed = false;
              for (const [key, val] of Object.entries(effect)) {
                if (val && state.needs[key] !== undefined) {
                  state.needs[key] += val;
                  changed = true;
                }
              }
              if (changed) {
                updateNeedsUI();
                saveGame();
              }
            }
          } catch(e) {}

          const interaction = obj.getAttribute('data-interaction');
          const data = obj.getAttribute('data-interaction-data');
          
          if (interaction === 'dialogue' || interaction === 'flavor_text') {
            dialogueBox.innerHTML = data;
            dialogueBox.style.display = 'block';
            setTimeout(() => dialogueBox.style.display = 'none', 4000);
          } else if (interaction === 'link') {
            window.open(data, '_blank');
          } else if (interaction === 'scene_change') {
            // In a real multi-scene export, this would load the next scene data
            dialogueBox.innerHTML = 'Loading scene: ' + data + '...';
            dialogueBox.style.display = 'block';
          }
          
          saveGame();
        });
      });
    });
  </script>
</body>
</html>
