<!DOCTYPE html>
<html><head>

    <title>✨ NABU'S SANCTUM ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;1,700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Cormorant Garamond', serif;
            background: radial-gradient(ellipse at center, #1a0033 0%, #000000 100%);
            color: #d4af37;
            overflow-x: hidden;
        }
        
        /* Cosmic background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        /* Mystical Taskbar */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 56px;
            background: linear-gradient(180deg, rgba(106, 13, 173, 0.9) 0%, rgba(26, 0, 51, 0.95) 100%);
            border-top: 2px solid #d4af37;
            display: flex;
            align-items: center;
            padding: 0 12px;
            z-index: 1000;
            box-shadow: 0 -4px 30px rgba(212, 175, 55, 0.3),
                        inset 0 2px 0 rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(10px);
        }
        
        .start-button {
            background: linear-gradient(135deg, #d4af37 0%, #f4c430 100%);
            color: #1a0033;
            border: 2px solid #d4af37;
            padding: 8px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 16px;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.3);
            position: relative;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        
        .start-button:hover {
            background: linear-gradient(135deg, #f4c430 0%, #d4af37 100%);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.9);
            transform: translateY(-2px);
        }
        
        .start-button::before {
            content: '⊹ ';
            color: #6a0dad;
        }
        
        /* Start Menu */
        .start-menu {
            position: fixed;
            bottom: 64px;
            left: 12px;
            width: 360px;
            background: linear-gradient(135deg, rgba(26, 0, 51, 0.95) 0%, rgba(106, 13, 173, 0.95) 100%);
            border: 2px solid #d4af37;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.5),
                        inset 0 0 30px rgba(212, 175, 55, 0.1);
            animation: mystical-appear 0.5s ease;
            backdrop-filter: blur(10px);
        }
        
        @keyframes mystical-appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .start-menu.active {
            display: flex;
        }
        
        .menu-header {
            background: linear-gradient(90deg, #d4af37 0%, #6a0dad 100%);
            color: #fff;
            padding: 16px;
            font-size: 20px;
            font-family: 'Cinzel', serif;
            border-bottom: 2px solid #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            text-align: center;
            letter-spacing: 3px;
        }
        
        .menu-item {
            padding: 14px 20px;
            cursor: pointer;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            color: #d4af37;
        }
        
        .menu-item:hover {
            background: rgba(212, 175, 55, 0.2);
            padding-left: 28px;
            color: #f4c430;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }
        
        .menu-item::before {
            content: '✧';
            color: #d4af37;
        }
        
        /* Taskbar buttons */
        .taskbar-buttons {
            display: flex;
            gap: 8px;
            flex: 1;
        }
        
        .taskbar-btn {
            background: rgba(212, 175, 55, 0.2);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Cormorant Garamond', serif;
            box-shadow: inset 0 1px 0 rgba(212, 175, 55, 0.3);
        }
        
        .taskbar-btn:hover {
            background: rgba(212, 175, 55, 0.4);
            border-color: #f4c430;
            color: #f4c430;
        }
        
        .system-tray {
            display: flex;
            gap: 14px;
            align-items: center;
            margin-left: auto;
            padding: 0 16px;
            font-size: 16px;
            color: #d4af37;
        }
        
        /* Main content */
        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 60px 40px 90px;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 50px 30px;
            background: rgba(26, 0, 51, 0.6);
            border: 3px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3),
                        inset 0 0 50px rgba(106, 13, 173, 0.2);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 4em;
            font-family: 'Cinzel', serif;
            color: #f4c430;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8),
                         0 0 40px rgba(106, 13, 173, 0.6);
            margin-bottom: 20px;
            letter-spacing: 6px;
        }
        
        .subtitle {
            font-size: 22px;
            color: #d4af37;
            font-style: italic;
            letter-spacing: 2px;
        }
        
        /* Content sections */
        .sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 35px;
        }
        
        .section {
            background: rgba(26, 0, 51, 0.6);
            border: 2px solid #d4af37;
            border-radius: 10px;
            padding: 32px;
            transition: all 0.4s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
        }
        
        .section:hover {
            background: rgba(26, 0, 51, 0.8);
            border-color: #f4c430;
            box-shadow: 0 8px 40px rgba(212, 175, 55, 0.4);
            transform: translateY(-8px);
        }
        
        .section h2 {
            font-size: 2em;
            font-family: 'Cinzel', serif;
            color: #f4c430;
            margin-bottom: 20px;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 12px;
            letter-spacing: 2px;
        }
        
        .section-desc {
            color: #d4af37;
            margin-bottom: 24px;
            font-size: 18px;
            font-style: italic;
        }
        
        .link-list {
            list-style: none;
        }
        
        .link-list li {
            margin: 14px 0;
        }
        
        .link-list a {
            color: #d4af37;
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s;
            display: inline-block;
            padding: 6px 12px;
            border-left: 3px solid transparent;
        }
        
        .link-list a::before {
            content: '⊹ ';
            margin-right: 8px;
            color: #6a0dad;
        }
        
        .link-list a:hover {
            color: #f4c430;
            border-left-color: #f4c430;
            padding-left: 20px;
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.8);
        }
        
        /* Mystical glow effect */
        @keyframes mystical-glow {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        
        .glow-orb {
            position: fixed;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            pointer-events: none;
            animation: mystical-glow 4s infinite;
        }
    </style>
