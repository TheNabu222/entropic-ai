<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Maker</title>
</head>
<body>
    <h1>Stage Maker</h1>
    <div id="props-container"></div>
    <script>
        // Fetching props data from props.json
        fetch('https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/data/props.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('props-container');
                data.forEach(prop => {
                    const propElement = document.createElement('div');
                    propElement.innerHTML = `<h2>${prop.title}</h2><img src='https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/assets/${prop.image}' alt='${prop.title}'>`;
                    container.appendChild(propElement);
                });
            })
            .catch(error => console.error('Error fetching props:', error));
    </script>
</body>
</html>
