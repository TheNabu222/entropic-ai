<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAVEBOT: Paleolithic Cybernetics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="crt-overlay"></div>
    <div id="scanline-bar"></div>

    <div id="start-overlay">
        <div>CAVEBOT // PROTOCOL</div>
        <div style="font-size: 0.5em; margin-top: 10px; color: #888;">Initialize Audio Subsystems...</div>
        <button id="start-btn">INITIALIZE</button>
    </div>
    
    <div id="game-container">
        <!-- Main Visual Stage -->
        <div id="stage">
            <div id="bg-layer" class="layer"></div>
            <div id="sprite-layer" class="layer">
                <!-- Sprites injected here -->
            </div>
            <div id="vfx-layer" class="layer"></div>
            
            <!-- Dice Overlay -->
            <div id="dice-container"></div>
        </div>

        <!-- Right Sidebar (Character Sheet) -->
        <div id="sidebar">
            <div class="panel-header">NABU_STATUS</div>
            
            <div id="stats-panel">
                <div class="stat-row">
                    <span class="stat-label">INSTINCT</span>
                    <span class="stat-val" id="val-instinct">3</span>
                    <div class="dice-icon">d20</div>
                </div>
                <div class="stat-row">
                    <span class="stat-label">CONNECT</span>
                    <span class="stat-val" id="val-connection">2</span>
                    <div class="dice-icon">d20</div>
                </div>
                
                <div style="margin-top: 15px;">
                    <span class="stat-label">GLITCH SYNC</span>
                    <div class="glitch-bar-container">
                        <div id="glitch-fill" class="glitch-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="panel-header" style="margin-top: 20px;">INVENTORY</div>
            <div id="inventory-grid">
                <!-- Inventory slots injected via JS -->
            </div>

            <div class="panel-header" style="margin-top: 20px;">SYSTEM_LOG</div>
            <div id="log-container">
                <div class="log-entry">System initialized...</div>
                <div class="log-entry">Simulating Year -10,000...</div>
            </div>
        </div>

        <!-- Bottom Dialogue Area -->
        <div id="dialogue-area">
            <div id="speaker-tag">NARRATOR</div>
            <div id="dialogue-text">
                <!-- Typewriter text goes here -->
            </div>
            <div id="choice-container">
                <!-- Buttons injected here -->
            </div>
        </div>

    </div>

    <!-- Logic -->
    <script src="data.js"></script>
    <script src="game.js"></script>
</body>
</html>
