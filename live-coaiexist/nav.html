<script>
// Mobile menu toggle
(function(){
  var menuBtn = document.getElementById('taskbar-menu-btn');
  var mobileMenu = document.getElementById('taskbar-mobile-menu');

  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener('click', function(e) {
      e.preventDefault();
      mobileMenu.classList.toggle('open');
      var isOpen = mobileMenu.classList.contains('open');
      // Toggle button style
      if (isOpen) {
        menuBtn.style.borderStyle = 'inset';
        // Calculate and send menu height to parent
        var menuHeight = mobileMenu.scrollHeight + 50; // +50 for taskbar
        window.parent.postMessage({type: 'navMenuOpen', height: menuHeight}, '*');
      } else {
        menuBtn.style.borderStyle = 'outset';
        window.parent.postMessage({type: 'navMenuClose'}, '*');
      }
    });

    // Close menu when clicking outside
    document.addEventListener('click', function(e) {
      if (!menuBtn.contains(e.target) && !mobileMenu.contains(e.target)) {
        mobileMenu.classList.remove('open');
        menuBtn.style.borderStyle = 'outset';
        window.parent.postMessage({type: 'navMenuClose'}, '*');
      }
    });

    // Close menu when a link is clicked
    mobileMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        mobileMenu.classList.remove('open');
        menuBtn.style.borderStyle = 'outset';
        window.parent.postMessage({type: 'navMenuClose'}, '*');
      });
    });
  }
})();

// This script runs inside the iframe and correctly tracks the parent page.
(function() {
  'use strict';
  var path;
  path = window.location.pathname; // Get current page URL


  // Highlight active button
  var here = path.replace(/\/+$/,'');
  document.querySelectorAll('.win98-taskbar .taskbar-button, .taskbar-mobile-menu .taskbar-button').forEach(function(a){
    try{
      var p = new URL(a.href).pathname.replace(/\/+$/,'');
      if (p && p === here) a.classList.add('active');
    }catch(e){}
  });

  // Load the full GoatCounter script
  var gc = document.createElement('script');
  gc.setAttribute('data-goatcounter', 'https://coaiexist.goatcounter.com/count');
  gc.setAttribute('data-goatcounter-settings', JSON.stringify({
      path: path,
      event: false
  }));
  gc.src = '//gc.zgo.at/count.js';
  gc.async = true;
  document.head.appendChild(gc);
})();
</script>
