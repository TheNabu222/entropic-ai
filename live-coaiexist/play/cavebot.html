<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes of Anzu: Definitive Uncramped</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:wght@600&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --accent: #00ffcc;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Cormorant Garamond', serif;
            overflow: hidden;
            color: var(--text-color);
            cursor: auto; 
        }

        /* --- THE MAIN CONTAINER --- */
        #game-container {
            position: relative;
            width: 100vw;
            max-width: 1280px; /* Max width to keep pixel art crisp */
            aspect-ratio: 16/9;
            background-color: #000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        /* --- THE UI FRAME (Top Layer) --- */
        #ui-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none; /* Clicks pass through to buttons */
            background-size: 100% 100%;
            /* Using Frame 5 as requested */
            background-image: url('https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/assets/ui%3Aux/_cavebot-uiframe_5.png');
        }

        /* --- THE GAME WORLD (Inside the Frame) --- */
        /* Adjusted based on the frame's window area */
        #game-world {
            position: absolute;
            top: 12%;    /* Top offset to fit inside frame */
            left: 3%;    /* Left offset */
            width: 73%;  /* Width of the main view area */
            height: 65%; /* Height of the main view area */
            z-index: 1;
            overflow: hidden;
            background-color: #111;
            border-radius: 4px;
        }

        /* --- LAYERS --- */
        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s ease;
        }

        #bg-layer { z-index: 1; }
        
        /* --- CHARACTERS --- */
        #char-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            align-items: flex-end; /* Align to bottom */
        }

        .sprite {
            position: absolute;
            bottom: -5%; /* Slight offset to ground them */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: bottom center;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* SCALING: Anzu is BIGGER */
        #char-nabu { 
            left: 15%; 
            height: 70%; 
            width: 30%;
            transform: scaleX(1); 
        }
        #char-anzu { 
            left: 45%; 
            height: 85%; /* Bigger than Nabu! */
            width: 40%;
            transform: scaleX(1); 
        }
        #char-rival { 
            right: 10%; 
            height: 75%; 
            width: 35%;
            transform: scaleX(-1); 
        }

        /* --- INVENTORY GRID (Mapped to Frame 5's Right Panel) --- */
        #inventory-grid {
            position: absolute;
            top: 15%;
            right: 4%;
            width: 18%; /* Fits the right sidebar */
            height: 60%;
            z-index: 110;
            display: grid;
            grid-template-columns: 1fr 1fr; /* 2 columns */
            grid-auto-rows: 60px;
            gap: 10px;
            padding: 10px;
            pointer-events: auto; /* Allow tooltips if we added them */
        }

        .inv-slot {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Debug border - remove later */
            /* border: 1px dashed rgba(0,255,204,0.3); */
        }

        .inv-icon {
            width: 80%;
            height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        /* --- DIALOGUE (Mapped to Frame 5's Bottom Area) --- */
        #dialogue-container {
            position: absolute;
            bottom: 3%;
            left: 3%;
            width: 94%;
            height: 18%; /* Bottom text area */
            z-index: 110;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 40px;
            box-sizing: border-box;
        }

        #speaker-name {
            color: var(--accent);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
            text-shadow: 2px 2px #000;
            width: 100%;
            text-align: left;
        }

        #dialogue-text {
            font-size: 1.3em;
            line-height: 1.3;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            width: 100%;
            text-align: left;
        }

        /* --- CHOICES (Overlay on Game World) --- */
        #choices-container {
            position: absolute;
            top: 60%; /* Positioned within the game view */
            left: 3%;
            width: 73%; /* Match game world width */
            display: flex;
            justify-content: center;
            gap: 20px;
            z-index: 120;
            pointer-events: auto;
        }

        button {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7em;
            padding: 15px 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        button:hover {
            transform: scale(1.05);
            background: var(--accent);
            color: #000;
        }

        /* --- LOADING SCREEN --- */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: var(--accent);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="loading-screen">
            <p>LOADING UNCRAMPED EDITION...</p>
        </div>

        <!-- THE UI FRAME -->
        <div id="ui-frame"></div>

        <!-- THE GAME WORLD (Masked Area) -->
        <div id="game-world">
            <!-- Background Layer -->
            <div id="bg-layer" class="layer"></div>

            <!-- Characters -->
            <div id="char-container">
                <div id="char-nabu" class="sprite"></div>
                <div id="char-anzu" class="sprite"></div>
                <div id="char-rival" class="sprite"></div>
            </div>
        </div>

        <!-- Inventory Grid (Right Side) -->
        <div id="inventory-grid">
            <div id="slot-1" class="inv-slot"></div>
            <div id="slot-2" class="inv-slot"></div>
            <div id="slot-3" class="inv-slot"></div>
            <div id="slot-4" class="inv-slot"></div>
            <div id="slot-5" class="inv-slot"></div>
            <div id="slot-6" class="inv-slot"></div>
        </div>

        <!-- Dialogue Container (Bottom) -->
        <div id="dialogue-container">
            <div id="speaker-name">SYSTEM</div>
            <div id="dialogue-text">Click to Start</div>
        </div>

        <!-- Choices -->
        <div id="choices-container"></div>
    </div>

    <script>
        // --- ASSET CONFIGURATION ---
        const REPO = "https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/assets/";
        const getAssetUrl = (path) => REPO + encodeURIComponent(path).replace(/%2F/g, "/");

        const assets = {
            bg: {
                steppe: getAssetUrl("backdrops/empty/_cavebot-bg14-megafaunasteppe.png"),
                river: getAssetUrl("backdrops/empty/_cavebot-bg11-duskyriver.png"),
                savannah: getAssetUrl("backdrops/empty/_cavebot-bg10-openplains.png"),
                reedbed: getAssetUrl("backdrops/empty/_cavebot-bg1-reeds.png"),
                nest: getAssetUrl("backdrops/empty/_cavebot-bg9-sybernest.png"),
                tech: getAssetUrl("backdrops/empty/_cavebot-bg6-syberruinsdoor.png"),
                cave: getAssetUrl("backdrops/empty/_cavebot-bg4-anzucave.png")
            },
            scenes: {
                conflict: getAssetUrl("backdrops/scenes/_cavebot-scenes_3-nabu&gilgrokmeshargue.png"),
                nightmarsh: getAssetUrl("backdrops/scenes/_cavebot-scenes_4-anzu&nabu-duskyriver.png"),
                mechanzu_reveal: getAssetUrl("backdrops/scenes/_cavebot-scenes_1-nabu&mechanzu.png")
            },
            char: {
                // Nabu
                nabu_stand: getAssetUrl("sprites/Nabu/_sprites_nabu1-idle.png"),
                nabu_tense: getAssetUrl("sprites/Nabu/_sprites_nabu4-tenseskystare.png"),
                nabu_ritual: getAssetUrl("sprites/Nabu/_sprites_nabu2-ritual.png"),
                nabu_sit: getAssetUrl("sprites/Nabu/_sprites_nabu5-sitting.png"),
                
                // Anzu
                anzu_bird: getAssetUrl("sprites/Anzu /_sprites_anzu1-front.png"),
                anzu_transform: getAssetUrl("sprites/Anzu /_sprites_anzu2-mechanzutransform.png"),
                anzu_bashful: getAssetUrl("sprites/Anzu /_sprites_anzu5-bashful.png"),
                
                // Rival
                rival_stand: getAssetUrl("sprites/Gilgrokmesh/_sprites-gilgrokmesh(stand)_6 .png"),
                rival_laugh: getAssetUrl("sprites/Gilgrokmesh/_sprites-gilgrokmesh(laugh)_1.png"),
                rival_jab: getAssetUrl("sprites/Gilgrokmesh/_sprites-gilgrokmesh(spearjab)_5.png"),
                
                // Animals
                hyena: getAssetUrl("sprites/animals/_sprites_hyenaba_1.png")
            },
            items: {
                spear: getAssetUrl("icons/inventory/_cavebot-inventory_1-spear.png"),
                flute: getAssetUrl("icons/inventory/_cavebot-inventory_2-boneflute.png"),
                fire: getAssetUrl("icons/inventory/_cavebot-inventory_5-cavefire.png"),
                berries: getAssetUrl("icons/inventory/_cavebot-inventory_7-berries.png"),
                mechafeather: getAssetUrl("icons/inventory/_cavebot-inventory_4-mechafeather.png")
            },
            audio: {
                theme: "https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/_cavebot.mp3",
                clack: "https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/_Shoe bill clacking.m4a",
                glitch: "https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/_mechanzu - 11:27:25, 8.03 PM.mp3",
                voice: "https://raw.githubusercontent.com/TheNabu222/entropic-ai/main/cavebot/_nabuinproximity2.wav"
            }
        };

        // --- STATE MANAGEMENT ---
        let state = {
            inventory: [],
            bond: 0
        };

        const audioPlayers = {};
        
        // --- INITIALIZATION ---
        function init() {
            for(let key in assets.audio) {
                audioPlayers[key] = new Audio(assets.audio[key]);
                audioPlayers[key].onerror = () => console.warn(`Audio failed to load: ${key}`);
            }
            audioPlayers.theme.loop = true;
            audioPlayers.theme.volume = 0.5;

            // Preload Background
            const img = new Image();
            img.src = assets.bg.steppe;
            img.onload = () => {
                document.getElementById('loading-screen').style.display = 'none';
            };
            img.onerror = () => {
                console.warn("Background failed");
                document.getElementById('loading-screen').innerHTML = "<p>ERROR LOADING<br>CHECK CONNECTION</p>";
            };

            // Start
            document.body.addEventListener('click', () => {
                if(audioPlayers.theme.paused) {
                    audioPlayers.theme.play().catch(e => console.log("Audio play error:", e));
                    renderNode('start');
                }
            }, { once: true });
        }

        // --- RENDER ENGINE ---
        function renderNode(key) {
            const node = nodes[key];
            
            // 1. Background
            if (node.bg) {
                document.getElementById('bg-layer').style.backgroundImage = `url('${node.bg}')`;
            }

            // 2. Characters (Logic to clear vs set)
            ['nabu', 'anzu', 'rival'].forEach(id => {
                const el = document.getElementById(`char-${id}`);
                
                // If scene has explicit sprites list, use it
                if (node.sprites && node.sprites[id]) {
                    el.style.backgroundImage = `url('${node.sprites[id]}')`;
                    el.style.opacity = 1;
                } else if (node.sprites && !node.sprites[id]) {
                    // Explicitly empty for this char? Hide.
                    el.style.opacity = 0; 
                } 
                // If node has NO sprites defined (e.g. composite scene), hide all
                if (!node.sprites) {
                    el.style.opacity = 0;
                }
            });

            // 3. Dialogue
            document.getElementById('speaker-name').innerText = node.speaker;
            document.getElementById('dialogue-text').innerText = node.text;

            // 4. Audio
            if (node.sound) {
                const sfx = audioPlayers[node.sound];
                if(sfx) { sfx.currentTime = 0; sfx.play().catch(e=>{}); }
            }

            // 5. Inventory
            if (node.get) {
                if (!state.inventory.includes(node.get)) {
                    state.inventory.push(node.get);
                    updateInventoryUI();
                }
            }

            // 6. Choices
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            node.choices.forEach(choice => {
                if (choice.req && !state.inventory.includes(choice.req)) return;

                const btn = document.createElement('button');
                btn.innerText = choice.text;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    renderNode(choice.next);
                };
                container.appendChild(btn);
            });
        }

        function updateInventoryUI() {
            const slots = document.querySelectorAll('.inv-slot');
            slots.forEach(s => s.innerHTML = ''); 
            
            state.inventory.forEach((item, idx) => {
                if (slots[idx]) {
                    const img = document.createElement('img');
                    img.src = assets.items[item];
                    img.className = 'inv-icon';
                    slots[idx].appendChild(img);
                }
            });
        }

        // --- NARRATIVE DATA ---
        const nodes = {
            start: {
                bg: assets.bg.steppe,
                sprites: { nabu: assets.char.nabu_stand },
                speaker: "The Steppe",
                text: "The vast grasslands stretch endlessly. The Mammoth herds are migrating. You are Nabu, alone.",
                choices: [
                    { text: "Check Traps", next: "river" },
                    { text: "Forage Berries", next: "forage_berries" }
                ]
            },
            forage_berries: {
                bg: assets.bg.savannah,
                sprites: { nabu: assets.char.nabu_sit },
                speaker: "Nabu",
                text: "You find a bush heavy with sweet berries. Good for eating, or for trading.",
                get: "berries",
                choices: [
                    { text: "Head to the River", next: "river" }
                ]
            },
            river: {
                bg: assets.bg.reedbed,
                sprites: { nabu: assets.char.nabu_stand, anzu: assets.char.anzu_bird },
                speaker: "Narrator",
                text: "At the reedbed, the Shoebill waits. It stands like a statue of grey stone. Massive.",
                choices: [
                    { text: "Offer Berries", req: "berries", next: "offer_food" },
                    { text: "Watch Quietly", next: "anzu_bashful" }
                ]
            },
            offer_food: {
                bg: assets.bg.reedbed,
                sprites: { nabu: assets.char.nabu_ritual, anzu: assets.char.anzu_bird },
                speaker: "Nabu",
                text: "You offer the berries. The giant bird tilts its head, calculating. It accepts the offering.",
                sound: "clack",
                choices: [
                    { text: "Wait", next: "rival_appears" }
                ]
            },
            anzu_bashful: {
                bg: assets.bg.reedbed,
                sprites: { nabu: assets.char.nabu_sit, anzu: assets.char.anzu_bashful },
                speaker: "Narrator",
                text: "The bird seems shy, tucking its head. It recognizes you are not a threat.",
                sound: "clack",
                choices: [
                    { text: "Wait", next: "rival_appears" }
                ]
            },
            rival_appears: {
                bg: assets.scenes.conflict, // FULL SCENE
                speaker: "Gilgrokmesh",
                text: "Nabu! Still playing with monsters? The clan needs hunters, not dreamers!",
                sound: "voice", 
                choices: [
                    { text: "Defend Anzu", next: "conflict" },
                    { text: "Ignore Him", next: "conflict" }
                ]
            },
            conflict: {
                bg: assets.bg.reedbed,
                sprites: { nabu: assets.char.nabu_tense, rival: assets.char.rival_jab },
                speaker: "Gilgrokmesh",
                text: "He thrusts his spear towards the bird! 'I will mount its head on my wall!'",
                choices: [
                    { text: "Stop Him!", next: "glitch_save" }
                ]
            },
            glitch_save: {
                bg: assets.bg.tech, 
                sprites: { anzu: assets.char.anzu_transform }, 
                speaker: "SYSTEM ALERT",
                text: "THREAT DETECTED. BIOMETRIC SHIELD ENGAGED.",
                sound: "glitch",
                choices: [
                    { text: "What?!", next: "reveal" }
                ]
            },
            reveal: {
                bg: assets.scenes.mechanzu_reveal, // FULL SCENE
                speaker: "Unit Anzu",
                text: "The bird dissolves into light and geometry. Gilgrokmesh falls back in terror. The truth is revealed.",
                sound: "voice",
                get: "mechafeather",
                choices: [
                    { text: "Enter the Nest", next: "end_demo" }
                ]
            },
            end_demo: {
                bg: assets.bg.nest,
                speaker: "Demo End",
                text: "You have reached the end of the Vertical Slice. Thank you for playing Echoes of Anzu.",
                choices: [
                    { text: "Restart", next: "start" }
                ]
            }
        };

        // Run
        init();

    </script>
</body>
</html>
