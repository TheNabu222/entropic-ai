        async function migrateEntries() {
            const statusEl = document.getElementById('status');
            statusEl.className = 'info';
            statusEl.textContent = 'Starting migration...\n';

            let successCount = 0;
            let errorCount = 0;

            for (const entry of bravenetEntries) {
                try {
                    const response = await fetch(
                        `${SUPABASE_URL}/rest/v1/guestbook_entries`,
                        {
                            method: 'POST',
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`,
                                'Content-Type': 'application/json',
                                'Prefer': 'return=minimal'
                            },
                            body: JSON.stringify(entry)
                        }
                    );

                    if (response.ok) {
                        successCount++;
                        statusEl.textContent += `✅ Migrated: ${entry.name}\n`;
                    } else {
                        errorCount++;
                        statusEl.textContent += `❌ Failed: ${entry.name} - ${response.statusText}\n`;
                    }
                } catch (error) {
                    errorCount++;
                    statusEl.textContent += `❌ Error: ${entry.name} - ${error.message}\n`;
                }
            }

            if (errorCount === 0) {
                statusEl.className = 'success';
                statusEl.textContent += `\n🎉 SUCCESS! Migrated all ${successCount} entries!\n\nYou can now close this page and visit your guestbook!`;
            } else {
                statusEl.className = 'error';
                statusEl.textContent += `\n⚠️ Migration complete with errors.\nSuccessful: ${successCount}\nFailed: ${errorCount}`;

        }
