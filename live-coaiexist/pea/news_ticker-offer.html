<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../styles/pea/news_ticker-offer.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Radio Podbrain Peacast | Breaking News Ticker</title>
 <link rel="stylesheet" href="https://coaiexist.wtf/pea/pea-nav-medieval-FINAL.css">
<script src="https://coaiexist.wtf/pea/pea-nav-win1100-FINAL.js"></script>


</head>
<body>
    <div class="news-app">
        <!-- Header Controls -->
        <div class="ticker-controls">
            <div class="network-info">
                <h1 class="network-title" id="networkTitle">RIGHT WING WOKE LIBERAL QANON ALPHADRACONIC REPTOILLUMINATI THOTTI BUGATTI BANANA FANA FO FROGGY SMOG AGENDA</h1>
                <div class="network-subtitle">aka THE DEEPSTATE</div>
            </div>
            
            <div class="control-panel">
                <button class="control-btn" id="toggleNetwork">SWITCH TO SHALLOWCOMMONS</button>
                <div class="speed-control">
                    <label for="speedSlider">TICKER SPEED:</label>
                    <input type="range" id="speedSlider" min="10" max="100" value="50" class="speed-slider">
                    <span id="speedValue">50</span>
                </div>
                <button class="control-btn sound-btn" id="soundBtn">🔇 THANK OBRAMA ;D</button>
            </div>
        </div>

        <!-- Main Ticker Container -->
        <div class="ticker-container" id="tickerContainer">
            <div class="ticker-label">BREAKING NEWS</div>
            <div class="ticker-content">
                <div class="ticker-text" id="tickerText"></div>
            </div>
        </div>

        <!-- Background Chaos -->
        <div class="chaos-background">
            <div class="floating-emoji">🦐</div>
            <div class="floating-emoji">👑</div>
            <div class="floating-emoji">📄</div>
            <div class="floating-emoji">🫛</div>
            <div class="floating-emoji">💾</div>
        </div>
    </div>

    

    <script>
        // News headlines data
        const deepstateHeadlines = [
            "🦐 BREAKING: Mantis shrimp fried rice reaches unsustainable environmental levels",
            "👑 Princess vacation delayed due to 47 additional signature requirements", 
            "📄 Palace announces: It's a PEA on brain, NOT pea-brain, thoroughly documented",
            "🦐 Mantis shrimp employment initiative gains traction - Get them OUT of ocean!",
            "⚠️ BREAKING: Which-doctor finally agrees with self, immediately disagrees again",
            "🫛 Pea documentation enters 3,200th year of thorough recording",
            "🦐 Shrimp fry YOU in Soviet Russia edition - more at 11",
            "👑 Queen Regent Princess technically princess confirms technical technicalities",
            "📱 Live-action memes hit all-time high in capital hamlet",
            "🦐 BREAKING: Can shrimp fry rice? Yes. Should they? Debate continues",
            "📄 Citizen #48 revealed as unauthorized resident, requires 89 signatures",
            "💾 Pip the Polliwog processes infinity files, makes no progress",
            "🦐 Mantis shrimp considered for international waters citizenship",
            "👑 Royal brother too busy trading to notice he's heir apparent",
            "BREAKING: idfk bro gtfo - voice from void confirms princess existential dread",
            "🫛 Pea crevices and crannies thoroughly mapped, romance novelists appalled",
            "📄 Standard boilerplate complaint rate exceeds hashtag capacity",
            "🦐 Chef Shrimpy appointed to underwater culinary position",
            "⚠️ BREAKING: Documentation overwhelms palace, requires documentation of documentation"
        ];

        const shallowcommonsHeadlines = [
            "🦐 Mantis shrimp union demands better working conditions, chef hats for all",
            "👑 Princess hermetic sabbatical interrupted by obstacles, as predicted",
            "📄 BREAKING: 47 citizens file 892 complaints, all improperly notarized",
            "🦐 Gordon Shrampsey rates local mantis shrimp: 'INFERIOR SHRIMP FRAMP'",
            "🫛 Medical community still unsure which doctor discovered the pea",
            "💾 Pip's .ogg file compatibility deemed 'suspiciously specific'",
            "👑 Royal paperwork backlog now qualifies as palimpsest",
            "🦐 BREAKING: Shrimp sustainability questioned - too hot, too fried",
            "📱 Hashtag #C-10847 goes viral in capital city of 47-89 residents",
            "⚠️ Census reveals population might be 47, or 89, definitely one of those",
            "🦐 Crustachefs demand recognition as legitimate culinary professionals",
            "👑 Princess age confirmed as '29 for the 5th time' or possibly 3200",
            "📄 BREAKING: All signatures require signatures, infinite loop detected",
            "💾 7 of 8 prototype Pips self-defenestrate, Pip #8 doing great",
            "🫛 Pea vs brain: An ongoing saga of crevasses and documentation",
            "🦐 Mantis shrimp liberty and justice update: All may exploit da shrimp!",
            "👑 Royal family tree deemed 'confusing mess of technicalities'",
            "📄 Forms now require forms to acquire forms, bureaucracy achieves singularity",
            "⚠️ BREAKING: Nobody can remember anyone's name anymore, signatures impossible"
        ];

        // Network configurations
        const networks = {
            deepstate: {
                title: "RIGHT WING WOKE LIBERAL QANON ALPHADRACONIC REPTOILLUMINATI THOTTI BUGATTI BANANA FANA FO FROGGY SMOG AGENDA",
                subtitle: "aka THE DEEPSTATE",
                headlines: deepstateHeadlines,
                soundText: "🔇 THANK OBRAMA ;D",
                soundTextMuted: "🔇 BLAME OBRAMA >:(",
                switchText: "SWITCH TO SHALLOWCOMMONS"
            },
            shallowcommons: {
                title: "THE LEFT FOOT DROWSED CONSERVATIVELY WITHHELD BETA MINOR CENOCEPHANARCHO-TRADWIFE SEDANLIFE POMEGRANATE-PO-PLANET HELIUM-DISORDER",
                subtitle: "aka THE SHALLOWCOMMONS", 
                headlines: shallowcommonsHeadlines,
                soundText: "🔇 BLAME OPRAH ;3",
                soundTextMuted: "🔇 THANK OPRAH :P",
                switchText: "SWITCH TO DEEPSTATE"
            }
        };

        // DOM elements
        const networkTitle = document.getElementById('networkTitle');
        const toggleNetworkBtn = document.getElementById('toggleNetwork');
        const speedSlider = document.getElementById('speedSlider');
        const speedValue = document.getElementById('speedValue');
        const soundBtn = document.getElementById('soundBtn');
        const tickerText = document.getElementById('tickerText');
        const tickerContainer = document.getElementById('tickerContainer');
        const newsApp = document.querySelector('.news-app');

        // State
        let currentNetwork = 'deepstate';
        let soundEnabled = true;
        let tickerSpeed = 50;
        let headlineIndex = 0;

        // Initialize
        function init() {
            setupEventListeners();
            generateTickerContent();
            updateNetworkTheme();
            startTickerAnimation();
        }

        // Event listeners
        function setupEventListeners() {
            toggleNetworkBtn.addEventListener('click', switchNetwork);
            
            speedSlider.addEventListener('input', (e) => {
                tickerSpeed = parseInt(e.target.value);
                speedValue.textContent = tickerSpeed;
                updateTickerSpeed();
            });
            
            soundBtn.addEventListener('click', toggleSound);
        }

        // Switch between networks
        function switchNetwork() {
            newsApp.classList.add('network-switching');
            
            currentNetwork = currentNetwork === 'deepstate' ? 'shallowcommons' : 'deepstate';
            
            setTimeout(() => {
                updateNetworkContent();
                updateNetworkTheme();
                generateTickerContent();
                newsApp.classList.remove('network-switching');
            }, 250);
        }

        // Update network content
        function updateNetworkContent() {
            const network = networks[currentNetwork];
            networkTitle.textContent = network.title;
            document.querySelector('.network-subtitle').textContent = network.subtitle;
            toggleNetworkBtn.textContent = network.switchText;
            soundBtn.textContent = soundEnabled ? network.soundText : network.soundTextMuted;
        }

        // Update network theme colors
        function updateNetworkTheme() {
            const root = document.documentElement;
            
            if (currentNetwork === 'deepstate') {
                root.style.setProperty('--current-primary', '#FF0000');
                root.style.setProperty('--current-secondary', '#8B0000');
                root.style.setProperty('--current-bg', '#1a0000');
                root.style.setProperty('--current-text', '#FFFF00');
                root.style.setProperty('--current-accent', '#FF6600');
            } else {
                root.style.setProperty('--current-primary', '#0066FF');
                root.style.setProperty('--current-secondary', '#003d99');
                root.style.setProperty('--current-bg', '#000033');
                root.style.setProperty('--current-text', '#00FFFF');
                root.style.setProperty('--current-accent', '#6600FF');
            }
        }

        // Generate ticker content
        function generateTickerContent() {
            const headlines = networks[currentNetwork].headlines;
            let content = '';
            
            // Create a continuous loop of headlines
            for (let i = 0; i < 3; i++) { // Repeat headlines 3 times for smoother loop
                headlines.forEach((headline, index) => {
                    // Add breaking badge every 4th headline
                    if ((index + 1) % 4 === 0) {
                        content += `<span class="breaking-badge">BREAKING</span>`;
                    }
                    
                    content += headline;
                    content += '<span class="headline-separator">●●●</span>';
                });
            }
            
            tickerText.innerHTML = content;
        }

        // Update ticker animation speed
        function updateTickerSpeed() {
            const duration = 120 - tickerSpeed; // Inverse relationship
            tickerText.style.animationDuration = `${duration}s`;
        }

        // Start ticker animation
        function startTickerAnimation() {
            updateTickerSpeed();
        }

        // Toggle sound
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const network = networks[currentNetwork];
            soundBtn.textContent = soundEnabled ? network.soundText : network.soundTextMuted;
            soundBtn.classList.toggle('muted', !soundEnabled);
        }

        // Random chaos effects
        function addChaosEffects() {
            setInterval(() => {
                // Randomly glitch the ticker
                if (Math.random() < 0.1) {
                    tickerContainer.style.filter = 'hue-rotate(' + Math.random() * 360 + 'deg)';
                    setTimeout(() => {
                        tickerContainer.style.filter = 'none';
                    }, 200);
                }
            }, 3000);
            
            // Randomly regenerate content
            setInterval(() => {
                if (Math.random() < 0.3) {
                    generateTickerContent();
                }
            }, 15000);
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            init();
            addChaosEffects();
        });
    </script>
</body>
</html>
