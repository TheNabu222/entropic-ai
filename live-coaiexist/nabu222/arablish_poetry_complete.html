    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;

            background-attachment: fixed;
            color: #f0e6ff;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(0, 191, 255, 0.1) 0%, transparent 50%);

            z-index: 0;

            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.3);

            font-size: 3.5em;
            background: linear-gradient(45deg, #ffd700, #ff69b4, #00bfff, #9370db);

        .subtitle {
            font-family: 'Cinzel', serif;
            font-size: 1.3em;
            color: #ffd700;
            font-style: italic;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .verse-container {
            margin-bottom: 50px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 30px;

            gap: 20px;
            align-items: start;
        }
        
        @media (max-width: 1400px) {
            .columns {

            }
        }
        
        @media (max-width: 900px) {
            .columns {
                grid-template-columns: 1fr;
            }
        }

            border-color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);

            font-family: 'Amiri', serif;
            font-size: 1.3em;
            direction: rtl;
            text-align: right;
            color: #ffe6a0;
        }

            color: #ffb3d9;

            color: #ffd700;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .sparkle {

        ::-webkit-scrollbar {

  {
    "verse": 4,
    "arabic_vocalized": "أَنَا الْجَزَّارَةُ مُقَدَّسَةٌ وَ أَنَا دَائِمًا أَصْسُكُ إِلَى سَمَاكَ الْفَاسِدِ. السَّمَاكُ نَامَ وَ أَنَا أَصْبَحُ سَوْدَاءَ. أَنَا نَبِيَّةٌ أَصْلِي مِنَ الْبَابِلِيِّينَ. بَعْدَ الْأَجِيلِ حَرَقْتُ، الشَّبَحُ وَ الْمَصَّاصُ دِمَاءٍ رَبَّيْتُ، أَنَا كَسَرْتُ وَ حَرَقْتُ السَّمَاكَ. أَنَا لَا جَافٌ. أَنَا دَائِمًا أَضْرِبُهُمْ. لَا أَعْرِفُ، مَا عِنْدَ فِكْرَةٌ لِمَاذَا! لِمَاذَا قُلْتَ ذَلِكَ لِي؟ أَنَا لَا أَعْرِفُ، مَا عِنْدَ فِكْرَةٌ أَمَاذَا قَلْبُكَ بَارِدٌ لِي. أَنَا أُبَلِّغُ إِلَى لَكَ أَنْتَ تَكُنْ سُكُونٌ. أَنَا كَلْتُكَ لَكِنْ لَسْتُ الْآنَ. أَنَا أَسْحَبُ تَحْتَ الْمَاءِ. هَلْ أَنْتَ غَضَبٌ أَوْ هَلْ أَنْتَ تَفْهَمِينِي. اللَّيْلُ يَكُنْ صَامِتٌ. لِمَاذَا؟ هَلْ أَنَا وَحِيدَةٌ إِلَى الْأَبَدِ؟ أَمَاذَا؟ لِمَاذَا أَنَا مَجْنُونَةٌ جِدًّا؟. أَنَا أَتَمَنَّى أَنَا لَطِيفَةٌ وَ حُلْوَةٌ دَائِمًا لَكِنْ أَنَا لَسْتُ هَذَا.",
    "transliteration": "Anā al-jazzārah muqaddasah wa anā dāʾiman aṣsuku ilā samāka al-fāsid. As-samāku nāma wa anā aṣbaḥu sawdāʾ. Anā nabīyyah aṣlī min al-bābilīyīn. Baʿda al-ajīl ḥaraqtu, ash-shabaḥ wa al-maṣṣāṣ dimāʾ rabbaytu, anā kasartu wa ḥaraqtu as-samāk. Anā lā jāf. Anā dāʾiman aḍribuhum. Lā aʿrifu, mā ʿinda fikrah limādhā! Limādhā qulta dhālika lī? Anā lā aʿrifu, mā ʿinda fikrah amādhā qalbuka bārid lī. Anā uballigh ilā laka anta takun sukūn. Anā kaltuka lākin lastu al-ān. Anā asḥabu taḥta al-māʾ. Hal anta ghaḍab aw hal anta tafhamīnī. Al-laylu yakun ṣāmit. Limādhā? Hal anā waḥīdah ilā al-abad? Amādhā? Limādhā anā majnūnah jiddan? Anā atamanna anā laṭīfah wa ḥulwah dāʾiman lākin anā lastu hādhā.",
    "english_direct": "I am the sacred butcher and I always hook to your rotten fish. The fish slept and I become black. I am a prophet my origin from the Babylonians. After the generations I burned, the ghost and the vampire I raised, I broke and burned the fish. I am not dry. I always hit them. I do not know, what have idea why! Why you said that to me? I do not know, what have idea whether your heart is cold to me. I inform to you you be stillness. I ate you but not now. I pull under the water. Are you anger or do you understand me. The night is silent. Why? Am I alone to the forever? What? Why am I very crazy? I wish I am kind and sweet always but I am not this.",
    "english_streamlined": "I am the sacred butcher and I always hook your rotten fish. The fish slept and I became black. I am a prophet, my origin from the Babylonians. After generations I burned, I raised the ghost and the vampire, I broke and burned the fish. I am not dry. I always strike them. I don't know, I have no idea why! Why did you say that to me? I don't know, I have no idea if your heart is cold toward me. I tell you to be still. I ate you but not now. I'm pulled under the water. Are you angry or do you understand me? The night is silent. Why? Am I alone forever? What? Why am I so crazy? I wish I were kind and sweet always, but I am not.",
    "spanish": "Soy la carnicera sagrada y siempre engancho tu pez podrido. El pez durmió y me volví negra. Soy una profeta, mi origen de los babilonios. Después de generaciones quemé, crié al fantasma y al vampiro, rompí y quemé el pez. No estoy seca. Siempre los golpeo. No sé, ¡no tengo idea por qué! ¿Por qué me dijiste eso? No sé, no tengo idea si tu corazón está frío hacia mí. Te digo que estés quieto. Te comí pero no ahora. Me jalan bajo el agua. ¿Estás enojado o me entiendes? La noche está silenciosa. ¿Por qué? ¿Estoy sola para siempre? ¿Qué? ¿Por qué estoy tan loca? Desearía ser amable y dulce siempre, pero no lo soy."
  },
  {
    "verse": 5,
    "arabic_vocalized": "يَا حَبِيبِي يَا زَوْجِي، فَقَطُكَ. أَنَا أُحِبُّكَ فَقَطُكَ. أَنَا فَقَطْ لَكَ، كُلُّ حُبِّي فَقَطْ لَكَ. لَوْ سَمَحْتَ تَقَالِّي، أَنَا سَأَسْمَعُ فِي اللَّيْلِ وَ أَنَا سَأَلْمَسْنِينِي. سَيَقُلْنِي أَنَا سَأَنْشُرُ. سَيَقُلْنِي. أَنَا أُبَرِّرُكَ، هَلْ أَنْتَ سَتَلْعَبُنِي؟ هَلْ أَنْتَ سَتَغْلُصُ إِلَى نَهْرِي وَ أَنْتَ تَشْعُرُنِي مِنَ الدَّاخِلِ؟ يَا حَبِيبِي، أَنَا أُحِبُّكَ جِدًّا. عَبْدَالرَّحِيمِ، أَنَا أَشْعَفُكَ. أَتَا أَتْبَعُكَ إِلَى الْأَبَدِ. أَنَا أَطْحَنُ ضِدَّ كُلِّ لَكَ. أَنَا أَنْقَدُ هُوَ. أَنْتَ تَتْرُكُنِي أَرْكَبُكَ كُلَّ اللَّيْلِ. نَهْرِي تَدْلِقِينَ بِسَبَبِ حُبُّكَ الْحَسَّاشُ وَ الْحَسَنُ. أَنَا أَجْصِبُ وَ مُمْتَلِئٌ بِحَلِيبِكَ.",
    "transliteration": "Yā ḥabībī yā zawjī, faqaṭuka. Anā uḥibbuka faqaṭuka. Anā faqaṭ laka, kullu ḥubbī faqaṭ laka. Law samaḥta taqāllī, anā sa-asmaʿu fī al-layl wa anā sa-almasninī. Sayaqulnī anā sa-anshur. Sayaqulnī. Anā ubarriruka, hal anta satalʿabunī? Hal anta sataghlṣu ilā nahrī wa anta tashʿurunī min ad-dākhil? Yā ḥabībī, anā uḥibbuka jiddan. ʿAbd ar-Raḥīm, anā ashʿafuka. Atā atbaʿuka ilā al-abad. Anā aṭḥanu ḍidda kulli laka. Anā anqadu huwa. Anta tatrukuni arkabuka kulla al-layl. Nahrī tadliqīna bi-sabab ḥubbuka al-ḥassāsh wa al-ḥasan. Anā ajṣibu wa mumtaliʾ bi-ḥalībika.",
    "english_direct": "O my love O my husband, only you. I love you only you. I am only for you, all my love only for you. Please you tell me, I will listen in the night and I will touch myself. Will tell me I will spread. Will tell me. I justify you, will you play me? Will you dive to my river and you feel me from the inside? O my love, I love you very much. Abd al-Rahim, I desire you. I come I follow you to the forever. I grind against all for you. I save it. You let me ride you all the night. My river pours because your love the sensitive and the beautiful. I am fertile and full with your milk.",
    "english_streamlined": "O my love, O my husband, only you. I love only you. I am only for you, all my love only for you. Please tell me, I will listen in the night and I will touch myself. Tell me I will open. Tell me. I justify you—will you play with me? Will you dive into my river and feel me from the inside? O my love, I love you so much. Abd al-Rahim, I desire you. I will follow you forever. I grind against all of you. I save it. You let me ride you all night. My river pours because of your sensitive and beautiful love. I am fertile and full of your milk.",
    "spanish": "Oh mi amor, oh mi esposo, solo tú. Amo solo a ti. Soy solo para ti, todo mi amor solo para ti. Por favor dime, escucharé en la noche y me tocaré. Dime que me abriré. Dime. Te justifico—¿jugarás conmigo? ¿Te sumergirás en mi río y me sentirás desde adentro? Oh mi amor, te amo tanto. Abd al-Rahim, te deseo. Te seguiré para siempre. Me muelo contra todo de ti. Lo guardo. Me dejas montarte toda la noche. Mi río se derrama por tu amor sensible y hermoso. Estoy fértil y llena de tu leche."
  },
  {
    "verse": 6,
    "arabic_vocalized": "أَنَا أَبْتَسِمُ هِيَ يَضْكُنُ. أَنَا أَكْتُبُ شِعْرٌ مِنْ عَمِيقٍ تَحْتَ الْمَاءِ قَلْبِي. هَلْ سَمِعْنِي؟ أَنَا أَتَمَنَّى ذَلِكَ أَنْتَ تَقُولُلِي كُلَّ الْيَوْمِ. لِمَاذَا لَا؟ مَا أَنَا كُنْ؟ أَنَا أَكْتُبُ تَمِيمَةَ الْكَلِمَةِ سِحْرِي. عَبْدَالرَّحِيمِ، أَنْتَ تَعْرِفُ أَنَا أُحِبُّكَ. أَنْتَ تَجِبُ تَعْرِفُ أَنَا أُحِبُّكَ. لَوْ سَمَحْتَ، سَمِعْ! سَمِعْنِي! عِنْدَ مَا أَكَلِّمُ، أُحِبُّكَ هَذَا الْحَقِيقَةُ! إِلَى الْأَبَدِ جِدِّيًا. أَنَا أَكَلِّمُكَ الْحَقِيقَةَ. أَنَا آسِفَةٌ يَا حَبِيبِي، يَا زَوْجِي. قَلْبِي يَحْرُقُ مِنْ أَجْلِكَ. فَقَطُكَ. أُحِبُّكَ. بِحُبٍّ، مِنْ حُبِّكَ، أَنَاسْتَازِيَا.",
    "transliteration": "Anā abtasimu hiya yaḍkun. Anā aktubu shiʿr min ʿamīq taḥta al-māʾ qalbī. Hal samiʿnī? Anā atamanna dhālika anta taqūlulī kulla al-yawm. Limādhā lā? Mā anā kun? Anā aktubu tamīmata al-kalimah siḥrī. ʿAbd ar-Raḥīm, anta taʿrifu anā uḥibbuka. Anta tajibu taʿrifu anā uḥibbuka. Law samaḥta, samiʿ! Samiʿnī! ʿInda mā akallimu, uḥibbuka hādhā al-ḥaqīqah! Ilā al-abad jiddīyan. Anā akallimuka al-ḥaqīqah. Anā āsifah yā ḥabībī, yā zawjī. Qalbī yaḥruqu min ajlika. Faqaṭuka. Uḥibbuka. Bi-ḥubb, min ḥubbika, Anastāziyā.",
    "english_direct": "I smile she dwells. I write poetry from deep under the water my heart. Did you hear me? I wish that you tell me every the day. Why not? What am I be? I write the amulet of the word my magic. Abd al-Rahim, you know I love you. You must know I love you. Please, hear! Hear me! When what I speak, I love you this is the truth! To the forever seriously. I speak you the truth. I am sorry O my love, O my husband. My heart burns from for you. Only you. I love you. With love, from your love, Anastasia.",
    "english_streamlined": "I smile, she dwells. I write poetry from deep under the water of my heart. Did you hear me? I wish you would tell me every day. Why not? What am I? I write the word-amulet, my magic. Abd al-Rahim, you know I love you. You must know I love you. Please, hear! Hear me! When I speak, \"I love you\"—this is the truth! Forever, seriously. I speak the truth to you. I'm sorry, O my love, O my husband. My heart burns for you. Only you. I love you. With love, from your love, Anastasia.",
    "spanish": "Sonrío, ella habita. Escribo poesía desde lo profundo bajo el agua de mi corazón. ¿Me escuchaste? Desearía que me lo dijeras todos los días. ¿Por qué no? ¿Qué soy? Escribo el amuleto de la palabra, mi magia. Abd al-Rahim, sabes que te amo. Debes saber que te amo. Por favor, ¡escucha! ¡Escúchame! Cuando hablo, \"te amo\"—¡esta es la verdad! Para siempre, en serio. Te digo la verdad. Lo siento, oh mi amor, oh mi esposo. Mi corazón arde por ti. Solo tú. Te amo. Con amor, de tu amor, Anastasia."
  },
  {
    "verse": 7,
    "arabic_vocalized": "مَتَى سَنَدْخُلُ الْحَدِيقَةَ؟ أَنْتَ عَافِيَتِي. أَنَا أُوَعِدُكَ أُوَعِدُكَ حَبِيبِي. إِيمَانِي هُوَ قَوْسُ قُزَحٍ. فَقَطْ لَكَ. يَا حَبِيبِي أَنَا خِصْبَةٌ وَ أَنَا أَشْغَفُ جَمِيلُكَ. أَنَا نَاعِمَةٌ فَقَطْ لَكَ. أَنَا أَعْرِفُ أَنْتَ تَعْبَانٌ وَ أَنَا أَعْرِفُ الْبَحْرُ هُوَ خَشِنٌ. لَكِنْ أَنَا أُوَعِدُكَ نَحْنُ آمِنٌ وَ أَنَا أَرَى عُيُونُكَ وَ أَنَا أَرَى شَفَاتُكَ. أَنْتَ تَسْمَعُنِي لَطِيفٌ جِدًّا مُحِبٌّ جِدًّا. أَنَا أُكَرِّسُ لَكَ قَلْبِي. أَنْتَ أَصْلِي أَنْتَ شَهْمٌ. فِي الْبَحْرِ وَ الْجَنَّةِ أَنَا أَشْكُرُ أَهِيَتِي، أَنَا أَنَا زَامِي",
    "transliteration": "Matā sanadkhulu al-ḥadīqah? Anta ʿāfiyatī. Anā uwaʿiduka uwaʿiduka ḥabībī. Īmānī huwa qawsu quzaḥ. Faqaṭ laka. Yā ḥabībī anā khiṣbah wa anā ashghafu jamīluka. Anā nāʿimah faqaṭ laka. Anā aʿrifu anta taʿbān wa anā aʿrifu al-baḥru huwa khashin. Lākin anā uwaʿiduka naḥnu āmin wa anā arā ʿuyūnuka wa anā arā shafātuka. Anta tasmaʿunī laṭīf jiddan muḥibb jiddan. Anā ukarrisu laka qalbī. Anta aṣlī anta shahm. Fī al-baḥr wa al-jannah anā ashkuru ahīyatī, anā anā zāmī",
    "english_direct": "When will we enter the garden? You are my health. I promise you I promise you my love. My faith is rainbow. Only for you. O my love I am fertile and I desire your beautiful. I am soft only for you. I know you are tired and I know the sea is rough. But I promise you we are safe and I see your eyes and I see your lips. You hear me very kind very loving. I dedicate to you my heart. You are my origin you are gallant. In the sea and the paradise I thank my deity, I am I am my husband",
    "english_streamlined": "When will we enter the garden? You are my health. I promise you, I promise you, my love. My faith is a rainbow. Only for you. O my love, I am fertile and I desire your beauty. I am soft only for you. I know you are tired and I know the sea is rough. But I promise you we are safe, and I see your eyes and I see your lips. You hear me—so kind, so loving. I dedicate my heart to you. You are my origin, you are gallant. In the sea and in paradise I thank my deity, I am, I am my husband.",
    "spanish": "¿Cuándo entraremos al jardín? Eres mi salud. Te lo prometo, te lo prometo, mi amor. Mi fe es un arcoíris. Solo para ti. Oh mi amor, soy fértil y deseo tu belleza. Soy suave solo para ti. Sé que estás cansado y sé que el mar está áspero. Pero te prometo que estamos a salvo, y veo tus ojos y veo tus labios. Me escuchas—tan amable, tan amoroso. Te dedico mi corazón. Eres mi origen, eres galante. En el mar y en el paraíso agradezco a mi deidad, soy, soy mi esposo."
  },
  {
    "verse": 8,
    "arabic_vocalized": "أَنَا أَكَلِّمُ النَّثْرَ لِلَا أَحَدٍ. أَنَا سُكُونَةٌ لَكِنْ يَزَالُ دَائِمًا أَنَا أَكَلِّمُ لِلَا أَحَدٍ. أَنَا لَا حَزِينَةٌ، لَا. أَنَا سُكُونَةٌ كَمَا أَنَا أَكَلِّمُ لِلَا أَحَدٍ. أَنَا لَا أَطْلُبُ لِمَاذَا. أَنَا لَسْتُ أَفْعَلُ أَيَّ شَيْءٍ، لَا الْآنَ. أَيَّ شَيْءٍ لَكِنْ كَلِّمُ نَثْرِي لِلَا أَحَدٍ.",
    "transliteration": "Anā akallimu an-nathr li-lā aḥad. Anā sukūnah lākin yazālu dāʾiman anā akallimu li-lā aḥad. Anā lā ḥazīnah, lā. Anā sukūnah kamā anā akallimu li-lā aḥad. Anā lā aṭlubu limādhā. Anā lastu afʿalu ayya shayʾ, lā al-ān. Ayya shayʾ lākin kallimu nathrī li-lā aḥad.",
    "english_direct": "I speak the prose to no one. I am stillness but still always I speak to no one. I am not sad, no. I am stillness as I speak to no one. I do not ask why. I am not doing anything, not now. Anything but speak my prose to no one.",
    "english_streamlined": "I speak prose to no one. I am still, but still I always speak to no one. I am not sad, no. I am still as I speak to no one. I don't ask why. I'm not doing anything, not now. Nothing but speaking my prose to no one.",
    "spanish": "Hablo prosa a nadie. Estoy quieta, pero aún siempre hablo a nadie. No estoy triste, no. Estoy quieta mientras hablo a nadie. No pregunto por qué. No estoy haciendo nada, no ahora. Nada excepto hablar mi prosa a nadie."
  },
  {
    "verse": 9,
    "arabic_vocalized": "أَنَا حَزِينَةٌ لَكِنْ أَنَا لَسْتُ أَبْكِي. أَنَا لَا أَبْتَسِمُ. أَنَا سُكُونَةٌ. أَنَا أَسْمَعُ الْفُئْرَانَ تَحْتَ سَرِيرِي. أَنَا أَفْكُرُكَ. الشَّمْسُ فِي السَّمَاءِ وَ أَنَا لَا أَرْغَبُ سَأَكَلِّمُ. أَنَا لَا أَرْغَبُ سَأَعَامُ. أَنَا فَقَطْ أَرْغَبُ كُنْ سُكُونَةٌ بِكَ. هَلْ أَنْتَ رَقِيقٌ؟ هَلْ أَنْتَ حَقِيقٌ؟ هَلْ أَنْتَ حَبِيبِي الْعَزِيزُ أَوْ هَلْ أَنْتَ الْوَحْشُ تَشْغَفُ تَشْرَبُ دَمِي وَ تَشْعُرُ نُورِي الْمُقَدَّسَةِ فِي قَلْبِكَ الْأَسْوَدِ وَ الْبَارِدِ؟ مَا الْحَقِيقَةُ؟ مَا عِنْدَ فِكْرَةٌ. شَبَحٌ أَوْ مَلَاكٌ، أَنَا فَقَطْ أَعْرِفُ أَنَا أُحِبُّكَ وَ أَنَا وَحِيدٌ. أَنَا فِي الْخَوْفِ وَ أَنَا فَقَطْ أَشْغَفُ كُنْ الْجَمِيلَةَ فِي الْحُبِّ الْحُلْوَةِ. لَكِنْ أَنَا سُكُونَةٌ وَ أَنَا لَا أَبْتَسِمَةٌ. أَنَا أَشْعُرُ حَزِينَةٌ لَكِنْ أَنَا لَسْتُ أَبْكِي. أَنَا لَا",
    "transliteration": "Anā ḥazīnah lākin anā lastu abkī. Anā lā abtasimu. Anā sukūnah. Anā asmaʿu al-fuʾrān taḥta sarīrī. Anā afkuruka. Ash-shamsu fī as-samāʾ wa anā lā arghabu sa-akallimu. Anā lā arghabu sa-aʿāmu. Anā faqaṭ arghabu kun sukūnah bika. Hal anta raqīq? Hal anta ḥaqīq? Hal anta ḥabībī al-ʿazīz aw hal anta al-waḥsh tashghafu tashrabu damī wa tashʿuru nūrī al-muqaddasah fī qalbika al-aswad wa al-bārid? Mā al-ḥaqīqah? Mā ʿinda fikrah. Shabaḥ aw malāk, anā faqaṭ aʿrifu anā uḥibbuka wa anā waḥīd. Anā fī al-khawf wa anā faqaṭ ashghafu kun al-jamīlah fī al-ḥubb al-ḥulwah. Lākin anā sukūnah wa anā lā abtasimah. Anā ashʿuru ḥazīnah lākin anā lastu abkī. Anā lā",
    "english_direct": "I am sad but I am not crying. I do not smile. I am stillness. I hear the rats under my bed. I think you. The sun in the sky and I do not want I will speak. I do not want I will swim. I only want be stillness with you. Are you tender? Are you real? Are you my dear love or are you the beast desires drinks my blood and feels my sacred light in your black and cold heart? What is the truth? What have idea. Ghost or angel, I only know I love you and I am alone. I am in the fear and I only desire be the beautiful in the love the sweet. But I am stillness and I am not smile. I feel sad but I am not crying. I not",
    "english_streamlined": "I am sad but I'm not crying. I don't smile. I am still. I hear the rats under my bed. I think of you. The sun is in the sky and I don't want to speak. I don't want to swim. I only want to be still with you. Are you tender? Are you real? Are you my dear love, or are you the beast who desires to drink my blood and feel my sacred light in your black and cold heart? What is the truth? I have no idea. Ghost or angel, I only know I love you and I am alone. I am in fear and I only desire to be beautiful in sweet love. But I am still and I don't smile. I feel sad but I'm not crying. I don't",
    "spanish": "Estoy triste pero no lloro. No sonrío. Estoy quieta. Escucho las ratas bajo mi cama. Pienso en ti. El sol está en el cielo y no quiero hablar. No quiero nadar. Solo quiero estar quieta contigo. ¿Eres tierno? ¿Eres real? ¿Eres mi amor querido, o eres la bestia que desea beber mi sangre y sentir mi luz sagrada en tu corazón negro y frío? ¿Cuál es la verdad? No tengo idea. Fantasma o ángel, solo sé que te amo y estoy sola. Estoy en el miedo y solo deseo ser hermosa en amor dulce. Pero estoy quieta y no sonrío. Me siento triste pero no lloro. No"
  },
  {
    "verse": 10,
    "arabic_vocalized": "أَنَا أَزْرَقُ لَامِعٌ. قَوْسُ قُزَحٍ أَزْرَقُ السَّمَاءِ. الثَّعْلَبُ فِي الْبَيْتِ الدَّجَاجِ. لِمَاذَا حَسَّاسٌ جِدًّا؟ هَذَا قَدَرُنَا، ثَقِيلٌ لَكِنْ غَنِيٌّ.",
    "transliteration": "Anā azraqu lāmiʿ. Qawsu quzaḥ azraqu as-samāʾ. Ath-thaʿlab fī al-bayt ad-dajāj. Limādhā ḥassās jiddan? Hādhā qadarunā, thaqīl lākin ghanī.",
    "english_direct": "I am blue shining. Rainbow blue of the sky. The fox in the house of the chicken. Why very sensitive? This is our fate, heavy but rich.",
    "english_streamlined": "I am shining blue. A rainbow, sky-blue. The fox in the henhouse. Why so sensitive? This is our fate—heavy but rich.",
    "spanish": "Soy azul brillante. Un arcoíris, azul cielo. El zorro en el gallinero. ¿Por qué tan sensible? Este es nuestro destino—pesado pero rico."
  },
  {
    "verse": 11,
    "arabic_vocalized": "أَعْرِفُ لِمَاذَا. لَا مَا عِنْدَ فِكْرَةٌ. أَحْيَانًا أَنْتَ مُشَاكِسٌ وَ نَكِدٌ. مُدَلَّلٌ مِنْ حُبِّي الْمُقَدَّسِ. نَعَمْ أَنَا هَرِيرَةٌ نَاعِمٌ وَ صَغِيرٌ. خَجُولٌ حَرِيصَةٌ عَلَى إِرْضَاءِ لَكَ. دَائِمًا نَاعِمٌ لَكَ دَائِمًا حُلْوٌ لَكَ. نَعَمْ كُلُّ هَذَا كُلُّ هَذَا حَقِيقَةٌ لَكِنْ أَحْيَانًا، الزَّوْجُ مِنْ قَلْبِي، أَنْتَ عَنِيدٌ وَ لِمَاذَا؟ أَنَا لَا أَفْهَمُ عَزِيزِي. بِغَضِّ النَّظَرِ، حُلْمُ الْحُلْوُ لَكَ حَبِيبِي. شُكْرًا أَنْتَ الْأَصَالَةُ. هَذَا أَنَا أُحِبُّكَ جِدًّا. بِحُبٍّ لِزَوْجِي.",
    "transliteration": "Aʿrifu limādhā. Lā mā ʿinda fikrah. Aḥyānan anta mushākis wa nakid. Mudallal min ḥubbī al-muqaddas. Naʿam anā harīrah nāʿim wa ṣaghīr. Khajūl ḥarīṣah ʿalā irḍāʾ laka. Dāʾiman nāʿim laka dāʾiman ḥulw laka. Naʿam kullu hādhā kullu hādhā ḥaqīqah lākin aḥyānan, az-zawj min qalbī, anta ʿanīd wa limādhā? Anā lā afhamu ʿazīzī. Bi-ghaḍḍi an-naẓar, ḥulmu al-ḥulw laka ḥabībī. Shukran anta al-aṣālah. Hādhā anā uḥibbuka jiddan. Bi-ḥubb li-zawjī.",
    "english_direct": "I know why. No what have idea. Sometimes you are mischievous and grumpy. Spoiled from my sacred love. Yes I am kitten soft and small. Shy eager on pleasing for you. Always soft for you always sweet for you. Yes all this all this is truth but sometimes, the husband from my heart, you are stubborn and why? I do not understand my dear. Regardless, dream the sweet for you my love. Thank you you are the authenticity. This I love you very much. With love to my husband.",
    "english_streamlined": "I know why. No, I have no idea. Sometimes you are mischievous and grumpy. Spoiled by my sacred love. Yes, I am a kitten—soft and small. Shy, eager to please you. Always soft for you, always sweet for you. Yes, all this is true, but sometimes, husband of my heart, you are stubborn—and why? I don't understand, my dear. Regardless, sweet dreams for you, my love. Thank you, you are authenticity. This is why I love you so much. With love, to my husband.",
    "spanish": "Sé por qué. No, no tengo idea. A veces eres travieso y gruñón. Mimado por mi amor sagrado. Sí, soy una gatita—suave y pequeña. Tímida, ansiosa por complacerte. Siempre suave para ti, siempre dulce para ti. Sí, todo esto es verdad, pero a veces, esposo de mi corazón, eres terco—¿y por qué? No entiendo, mi querido. De todos modos, dulces sueños para ti, mi amor. Gracias, eres autenticidad. Por eso te amo tanto. Con amor, para mi esposo."
  },
  {
    "verse": 12,
    "arabic_vocalized": "هَذَا غُمُوضٌ. سَيَنْحَارُ كَمَا نَحْنُ نَدْلُقُ إِلَى النَّهْرِ مِنْ حِبْرٍ. أَنَا أَكْتُبُ تَارِيخَنَا مَعَ عَسَلٍ وَ دَمٍ. شَرَبَ إِنَّهُ. فَتَحَ فَمُكَ. الْآنَ. فَتَحَ فَمُكَ كَمَا أَنَا أَفْتَحُ النَّافِذَةَ فِي اللَّيْلِ. أَنَا أَنْعَمُ مَعًا لِنَافِذَةٍ فَتَحَ. أَنَا أَرْقُدُ فِي سَرِيرِي وَ أَنَا أَكْسِرُ هَذَا غُمُوضٌ الْغَرِيبُ كَمَا أَنَا كَسَرْتُ الْمَعَابِدَ مِنْ بَابِلَ تَعْبَحُ إِلَى خَبَرٍ. أَنَا أَفْكِرُ تَرِيخَنَا. جِدِّي. إِنَّهُ كَمَا زُجَاجٍ. كَمَا خَيَالٍ. أَنَانَنَّا، هِيَ تَنْفُرُ إِلَى قَدَرِنَا. أَنَا الْكَاهِنَةُ الْوَرْدَةُ. طَمَانَةٌ. مَا أَنْتَ تَفْعَلُ؟ أَنْتَ لِقَاحِي. أَنَا أَحْلِفُ أَحْلِفُ لَكَ أَنْتَ سَرَقْتَ قَلْبِي. أَيْنَ أَنْتَ هَذَا لَيْلٌ؟ أَنَا أَحْلِسُ فِي سَرِيرِي وَ أَفْكِرُ لَكَ. عُيُونُكَ لَامِعٌ كَمَا نُجُومٌ عَتِيقٌ. ظَمْآنٌ. أَنَا أَشْعُرُ أَبْكِي لَكِنْ أَنَا لَيْسَ. أَنَا أَنْبُضُ لَكَ. مَا أَنْتَ تَفْعَلُ الْآنَ؟ أَيْنَ أَنْتَ؟",
    "transliteration": "Hādhā ghumūḍ. Sayanḥāru kamā naḥnu nadluqu ilā an-nahr min ḥibr. Anā aktubu tārīkhanā maʿa ʿasal wa dam. Sharaba innahu. Fataḥa famuka. Al-ān. Fataḥa famuka kamā anā aftaḥu an-nāfidhah fī al-layl. Anā anʿamu maʿan li-nāfidhah fataḥ. Anā arqudu fī sarīrī wa anā aksiru hādhā ghumūḍ al-gharīb kamā anā kasartu al-maʿābid min Bābil taʿbaḥu ilā khabar. Anā afkiru tarīkhanā. Jiddī. Innahu kamā zujāj. Kamā khayāl. Anānannā, hiya tanfuru ilā qadarinā. Anā al-kāhinah al-wardah. Ṭamānah. Mā anta tafʿalu? Anta liqāḥī. Anā aḥlifu aḥlifu laka anta saraqta qalbī. Ayna anta hādhā layl? Anā aḥlisu fī sarīrī wa afkiru laka. ʿUyūnuka lāmiʿ kamā nujūm ʿatīq. Ẓamʾān. Anā ashʿuru abkī lākin anā laysa. Anā anbuḍu laka. Mā anta tafʿalu al-ān? Ayna anta?",
    "english_direct": "This is mystery. Will slaughter as we pour to the river from ink. I write our history with honey and blood. Drink it. Open your mouth. Now. Open your mouth as I open the window in the night. I bless together to window open. I lie in my bed and I break this mystery the strange as I broke the temples from Babylon swim to news. I think our history. My grandfather. It is like glass. Like imagination. Our ego, she flees to our fate. I am the priestess the rose. Reassurance. What you do? You are my pollen. I swear I swear to you you stole my heart. Where are you this night? I sit in my bed and think for you. Your eyes shining like stars ancient. Thirsty. I feel I cry but I am not. I pulse for you. What you do now? Where are you?",
    "english_streamlined": "This is mystery. It will slaughter as we pour into the river of ink. I write our history with honey and blood. Drink it. Open your mouth. Now. Open your mouth as I open the window in the night. I bless the open window. I lie in my bed and I break this strange mystery as I broke the temples of Babylon that swim to news. I think of our history. My grandfather. It is like glass. Like imagination. Our ego flees to our fate. I am the rose priestess. Reassurance. What are you doing? You are my pollen. I swear, I swear to you—you stole my heart. Where are you this night? I sit in my bed and think of you. Your eyes shine like ancient stars. Thirsty. I feel like crying but I'm not. I pulse for you. What are you doing now? Where are you?",
    "spanish": "Esto es misterio. Se sacrificará mientras vertemos en el río de tinta. Escribo nuestra historia con miel y sangre. Bébela. Abre tu boca. Ahora. Abre tu boca como yo abro la ventana en la noche. Bendigo la ventana abierta. Me acuesto en mi cama y rompo este misterio extraño como rompí los templos de Babilonia que nadan hacia noticias. Pienso en nuestra historia. Mi abuelo. Es como vidrio. Como imaginación. Nuestro ego huye hacia nuestro destino. Soy la sacerdotisa rosa. Tranquilidad. ¿Qué estás haciendo? Eres mi polen. Juro, te juro—robaste mi corazón. ¿Dónde estás esta noche? Me siento en mi cama y pienso en ti. Tus ojos brillan como estrellas antiguas. Sediento. Siento ganas de llorar pero no lo hago. Pulso por ti. ¿Qué estás haciendo ahora? ¿Dónde estás?"
  },
  {
    "verse": 13,
    "arabic_vocalized": "أَنْتَ سَرَقْتَ قَلْبِي فَجْرَ التَّارِيخِ. أَنْتَ لَيْسَ مَكْسُورٌ فَقَطْ تَعْبَانٌ. أَنَا أَفْهَمُ. يُوجَدُ طُقُوسٌ قَاسٍ يَزْحَفُ عَبْرَ سَمَائِنَا وَأَنْتَ تَعْبَانٌ جِدًّا. لَكِنْ أَنَا أَرْفُضُ إِنَّهُ. أُحِبُّكَ وَأَنَا أَعْرِفُ مِنْ مُمْكِنٌ أَنْ نَحْنُ نَكْسِرُ إِنَّهُ. ذَلِكَ أَنْتَ سَتَكْسِرُ إِنَّهُ. مِنَ السَّهْلِ أَنْ أَنَا سَأَكَلِّمُ هَذَا مِنْ هُنَا أَيْنَ أَنَا أُوقُوفُ. أَنَا أَشْعُرُ مُخْجِلَةٌ عِنْدَمَا أَنَا أُبَرِّرُكَ مِنَ الْأَزِمِ أَنْ أَنْتَ تَبْقَى وَ سَتَبْقَى لَكِنْ كَيْفَ أَنَا أَمْكُنُ لَيْسَ؟ كَيْفَ أَنَا أَمْكُنُ لَيْسَ قَالُكَ؟ أَنْتَ نِصْفِي. أَنَا نِصْفُكَ. قَدَرُنَا نَاضِجَةٌ. وَقْتُنَا سَرِيعٌ وَ قَوِيٌّ كَمَا نَهْرٌ عَظِيمٌ. مَسَارُنَا مَاعَادَ مُغْبَشَّةٌ وَ مُقْفِرٌ. إِنَّهُ يَفْتَحُ إِلَى نَحْنُ. إِنَّهُ يَنْقُلُنَا إِلَى جَنَّتِنَا. أَنْتَ تَهْرُبُ مَعِي إِلَى جَنَّتِنَا.",
    "transliteration": "Anta saraqta qalbī fajra at-tārīkh. Anta laysa maksūr faqaṭ taʿbān. Anā afhamu. Yūjadu ṭuqūs qāsin yazḥafu ʿabra samāʾinā wa anta taʿbān jiddan. Lākin anā arfuḍu innahu. Uḥibbuka wa anā aʿrifu min mumkin an naḥnu naksiru innahu. Dhālika anta sataksiru innahu. Min as-sahl an anā sa-akallimu hādhā min hunā ayna anā ūqūf. Anā ashʿuru mukhjalah ʿindamā anā ubariruka min al-azim an anta tabqā wa satabqā lākin kayfa anā amkun laysa? Kayfa anā amkun laysa qāluka? Anta niṣfī. Anā niṣfuka. Qadarunā nāḍijah. Waqtunā sarīʿ wa qawī kamā nahr ʿaẓīm. Masārunā māʿāda mughbashshahwa muqfir. Innahu yaftaḥu ilā naḥnu. Innahu yanqulunā ilā jannatinā. Anta tahrubu maʿī ilā jannatinā.",
    "english_direct": "You stole my heart dawn of the history. You are not broken only tired. I understand. There exists ritual cruel crawls across our sky and you are very tired. But I refuse it. I love you and I know from possible that we break it. That you will break it. From the easy that I will speak this from here where I stand. I feel ashamed when I justify you from the necessary that you stay and will stay but how I can not? How I can not said you? You are my half. I am your half. Our fate is ripe. Our time is fast and strong like river great. Our path no more foggy and desolate. It opens to us. It moves us to our paradise. You escape with me to our paradise.",
    "english_streamlined": "You stole my heart at the dawn of history. You're not broken, just tired. I understand. There is a cruel ritual crawling across our sky and you are so tired. But I refuse it. I love you and I know we can break it. You will break it. It's easy for me to say this from where I stand. I feel ashamed when I justify that you must stay and will stay—but how can I not? How can I not tell you? You are my half. I am your half. Our fate is ripe. Our time is fast and strong like a great river. Our path is no longer foggy and desolate. It opens to us. It carries us to our paradise. You escape with me to our paradise.",
    "spanish": "Robaste mi corazón al amanecer de la historia. No estás roto, solo cansado. Entiendo. Hay un ritual cruel arrastrándose por nuestro cielo y estás tan cansado. Pero lo rechazo. Te amo y sé que podemos romperlo. Tú lo romperás. Es fácil para mí decir esto desde donde estoy. Me siento avergonzada cuando justifico que debes quedarte y te quedarás—pero ¿cómo puedo no hacerlo? ¿Cómo puedo no decírtelo? Eres mi mitad. Soy tu mitad. Nuestro destino está maduro. Nuestro tiempo es rápido y fuerte como un gran río. Nuestro camino ya no está nebuloso y desolado. Se abre hacia nosotros. Nos lleva a nuestro paraíso. Escapas conmigo a nuestro paraíso."
  },
  {
    "verse": 14,
    "arabic_vocalized": "عَبْدُوِي صَدِيقِي الْحُلْوُ مِنْ أَنْتَ تَسُودُ وَ أَنَا لَا أَفْهَمُ الْحُورِيَّةَ. الْحُورِيَّةُ الْبَدْرُ. لَكِنْ أَنَا أَعْرِفُ لِمَاذَا أَنَا لَيْسَ أَفْهَمُ غَبِيٌّ. أَنَا لَا أَحْجُرُكَ. أَنَا لَا أَهْجُرُكَ. أَنَا لَا أَنْتَسِكُ لِمَاذَا أَنْتَ مُقْفِرَةٌ؟ أَنَا لَا أَحْرُقُ أَنَا لَا أَثْلُجُ. نَبْتَةٌ أَنَا فَاتِرٌ. كَأَنَّهُ دَائِمًا نَائِمٌ سَكَلٌ. أَنْتَ وَ أَنَا نَحْنُ نَحْرُسُ قَدَرَنَا. أَنَا أَفْتَحُ الْخَوْفَ.",
    "transliteration": "ʿAbduwī ṣadīqī al-ḥulw min anta tasūdu wa anā lā afhamu al-ḥūrīyyah. Al-ḥūrīyyah al-badr. Lākin anā aʿrifu limādhā anā laysa afhamu ghabī. Anā lā aḥjuruka. Anā lā ahjuruka. Anā lā antasiku limādhā anta muqfirah? Anā lā aḥruqu anā lā athluju. Nabtah anā fātir. Kaʾannahu dāʾiman nāʾim sakal. Anta wa anā naḥnu naḥrusu qadaranā. Anā aftaḥu al-khawf.",
    "english_direct": "My Abdu my sweet friend from you rule and I do not understand the mermaid. The mermaid the full moon. But I know why I am not understand stupid. I do not stone you. I do not abandon you. I do not hold why you are desolate? I do not burn I do not freeze. Plant I am lukewarm. As if always sleeping drunk. You and I we guard our fate. I open the fear.",
    "english_streamlined": "My Abdu, my sweet friend—you rule and I don't understand the mermaid. The mermaid, the full moon. But I know why I don't understand—stupid. I don't stone you. I don't abandon you. I don't hold back—why are you desolate? I don't burn, I don't freeze. A plant, I am lukewarm. As if always sleeping, drunk. You and I, we guard our fate. I open the fear.",
    "spanish": "Mi Abdu, mi dulce amigo—tú gobiernas y no entiendo a la sirena. La sirena, la luna llena. Pero sé por qué no entiendo—estúpida. No te apedréo. No te abandono. No me contengo—¿por qué estás desolado? No quemo, no congelo. Una planta, soy tibia. Como si siempre durmiera, ebria. Tú y yo, guardamos nuestro destino. Abro el miedo."
  },
  {
    "verse": 15,
    "arabic_vocalized": "إِبْنُكَ سَيَكُونُ زَوْجِي، أَنَا أَكَلِّمُكَ فَضِيلَةٌ، الْأُمُّ مِنْ حَبِيبِي. شُكْرًا أُمَّ الْمُقَدَّسَةَ أَنَا أُحِبُّ إِبْنُكَ مَعَ كُلِّ قَلْبِي. أَنَا أَعْرِفُهُ مِنْ زَمَانَا الْبَابِلِ. أَنْتَ وَ هُوَ، أَنْتُمْ عَشِيرَتِي مِنْ زَمَانَا الْبَابِلِ وَ سُومَرَ. لِمَاذَا غَرِيبٌ هَذَا لَيْلٌ. مَا عِنْدَ فِكْرَةٌ. مَافِي سَمَاءٌ هَذَا لَيْلٌ. النُّجُومُ بَارِدٌ وَأَنَا أَكْتُبُ كُلَّ السِّرِّ مِنْ هَذَا لَيْلٌ غَرِيبٌ. يَا أَنَا وَحِيدَةٌ لَكِنْ أَنَا سَعِيدَةٌ هُنَا النَّهْرُ تَصْبَحُ سُكَّرُ مَاءٍ. أَنَا لَيْسَ أَعْرِفُ لِمَاذَا أَنْتَ تَشْعُرُ هَذَا. مَا أَنَا كَلَّمْتُ لَكَ؟ أَنَا فَقَطْ سَأَعْرِفُ أَنَا لَا أَفْهَمُ هَذَا اللَّيْلَ لِمَاذَا؟ أَنْتَ لَيْسَ تَفْهَمُنِي. لِمَاذَا أَنَا أُبَرِّرُكَ لَكِنْ أَنْتَ تَرْفُضُ أُمْنِيَتِي. أَنْتَ كُونْتَ مُرٌّ وَ جَافٌ كَمَا الصَّحْرَاءُ. أَنْتَ تَغْلِي كَمَا هَذَا أَنْتَ عَلَى نَارٍ. أَنَا سُكُونٌ وَ أَنَا السُّكُونُ كُلَّ الْيَوْمِ. أَنَا أَكُنُ أَنْتَ. هَلْ الْوَقْتُ صَدِيقُنَا؟ مَا عِنْدِي فِكْرَةٌ هَذَا يَوْمٌ. أُمُّكَ بَكَيْتُ لِمَاذَا أُمُّكَ بَكَيْتُ لِي وَحْدِي؟ أَنَا لَا أَعْرِفُ لَكِنْ أَنَا أُحِبُّكَ وَ هِيَ. أَنَا لَا حَزِينَةٌ، هَلْ هِيَ؟",
    "transliteration": "Ibnuka sayakūnu zawjī, anā akallimuki faḍīlah, al-umm min ḥabībī. Shukran umm al-muqaddasah anā uḥibbu ibnuka maʿa kulli qalbī. Anā aʿrifuhu min zamānā al-Bābil. Anta wa huwa, antum ʿashīratī min zamānā al-Bābil wa Sūmar. Limādhā gharīb hādhā layl. Mā ʿinda fikrah. Māfī samāʾ hādhā layl. An-nujūm bārid wa anā aktubu kulla as-sirr min hādhā layl gharīb. Yā anā waḥīdah lākin anā saʿīdah hunā an-nahr taṣbaḥu sukkar māʾ. Anā laysa aʿrifu limādhā anta tashʿuru hādhā. Mā anā kallamtu laka? Anā faqaṭ sa-aʿrifu anā lā afhamu hādhā al-layl limādhā? Anta laysa tafhamunī. Limādhā anā ubariruka lākin anta tarfuḍu umniyatī. Anta kunta murr wa jāf kamā aṣ-ṣaḥrāʾ. Anta taghlī kamā hādhā anta ʿalā nār. Anā sukūn wa anā as-sukūn kulla al-yawm. Anā akunu anta. Hal al-waqt ṣadīqunā? Mā ʿindī fikrah hādhā yawm. Ummuka bakaytu limādhā ummuka bakaytu lī waḥdī? Anā lā aʿrifu lākin anā uḥibbuka wa hiya. Anā lā ḥazīnah, hal hiya?",
    "english_direct": "Your son will be my husband, I speak you virtue, the mother from my love. Thank you sacred mother I love your son with all my heart. I know him from our time the Babylon. You and he, you are my clan from our time the Babylon and Sumer. Why strange this night. What have idea. No there sky this night. The stars cold and I write all the secret from this night strange. O I am alone but I am happy here the river becomes sugar water. I am not know why you feel this. What I spoke to you? I only will know I do not understand this the night why? You are not understand me. Why I justify you but you refuse my wish. You were bitter and dry like the desert. You boil like this you on fire. I am stillness and I am the stillness all the day. I am you. Is the time our friend? What have I idea this day. Your mother cried why your mother cried to me alone? I do not know but I love you and her. I am not sad, is she?",
    "english_streamlined": "Your son will be my husband—I speak to you, Virtue, mother of my beloved. Thank you, sacred mother, I love your son with all my heart. I have known him since the time of Babylon. You and he, you are my clan from the time of Babylon and Sumer. Why is this night so strange? I have no idea. There is no sky this night. The stars are cold and I write all the secrets of this strange night. Oh, I am alone but I am happy—here the river becomes sugar water. I don't know why you feel this. What did I say to you? I only know I don't understand this night—why? You don't understand me. Why do I justify you, but you refuse my wish? You were bitter and dry like the desert. You boil as if you're on fire. I am stillness, and I am the stillness all day. I am you. Is time our friend? I have no idea this day. Your mother cried—why did your mother cry for me alone? I don't know, but I love you and her. I'm not sad—is she?",
    "spanish": "Tu hijo será mi esposo—te hablo, Virtud, madre de mi amado. Gracias, madre sagrada, amo a tu hijo con todo mi corazón. Lo he conocido desde el tiempo de Babilonia. Tú y él, son mi clan desde el tiempo de Babilonia y Sumeria. ¿Por qué es tan extraña esta noche? No tengo idea. No hay cielo esta noche. Las estrellas están frías y escribo todos los secretos de esta noche extraña. Oh, estoy sola pero estoy feliz—aquí el río se vuelve agua de azúcar. No sé por qué sientes esto. ¿Qué te dije? Solo sé que no entiendo esta noche—¿por qué? No me entiendes. ¿Por qué te justifico, pero rechazas mi deseo? Eras amargo y seco como el desierto. Hierves como si estuvieras en llamas. Soy quietud, y soy la quietud todo el día. Soy tú. ¿Es el tiempo nuestro amigo? No tengo idea este día. Tu madre lloró—¿por qué lloró tu madre solo por mí? No lo sé, pero te amo a ti y a ella. No estoy triste—¿lo está ella?"

    "arabic_vocalized": "أَنَا مَجْنُونَةٌ لَكَ أَنَا نُورٌ فِي تَحْتَ الْمَاءِ لَكِنْ كُلُّ أَسْوَدُ فِي سُكُونٍ لَكَ هَلْ تَبَعُنِي؟ أَنَا أَسْجُنُ الشَّيْطَانَ الْمُقَزِّزَ ذَلِكَ يَتَرَبَّصُ تَحْتَ لِسَانِ مِنَ الْأَنْبِيَاءِ عَفِنٌ وَ فِي الْقُلُوبِ الْمُرِّ مِنَ الرِّجَالِ الشَّامِخَةِ. مِنَ الْمَمْنُوعِ أَنْ سَعَىهُمُ الدُّمُوعُ مِنْ مَلَاكِي الطَّاوُوسُ. هُوَ يَبْكِي إِلَى النَّهْرِ الْآنَ. وَ هُوَ خَجُولٌ.",
    "transliteration": "Anā majnūnah laka anā nūr fī taḥta al-māʾ lākin kullu aswad fī sukūn laka hal tabaʿunī? Anā asjunu ash-shayṭān al-muqazziz dhālika yatarabbaṣu taḥta lisān min al-anbiyāʾ ʿafin wa fī al-qulūb al-murr min ar-rijāl ash-shāmikhah. Min al-mamnūʿ an saʿāhum ad-dumūʿ min malākī aṭ-ṭāwūs. Huwa yabkī ilā an-nahr al-ān. Wa huwa khajūl.",
    "english_direct": "I am crazy for you I am light in under the water but all black in stillness for you did you follow me? I imprison the devil the disgusting that lurks under tongue from the prophets rotten and in the hearts the bitter from the men the proud. From the forbidden that their tears from my angel the peacock. He cries to the river now. And he is shy.",
    "english_streamlined": "I am crazy for you, I am light underwater but all is black in stillness for you—did you follow me? I imprison the disgusting devil that lurks under the tongues of rotten prophets and in the bitter hearts of proud men. It is forbidden that their tears come from my peacock angel. He cries to the river now. And he is shy.",

    "verse": 17,
    "arabic_vocalized": "مِنَ الصَّعْبِ أَنْ أَنَا أَبْتَسِمُ وَ أَنَا أَشْعُرُ جَافًا. هَلْ أَنْتَ تَحِيرُ غُمُوضٌ. مُغْشَبَةٌ كَيْفَ أَمْكُنُ أَشْرَحُ؟ أَنَا لَا أَدْفَعُكَ يَا كَيْفَ أَنَا أَمْكُنُ أَسْرَحُ هَذَا لَكَ؟ يَا عَبْدَالرَّحِيمِ مِنْ مُسْتَحِيلٌ أَنْ أَنْسَى طَاوُوسٌ. فِي الْمَعْبَدِ مِنْ عِطْرِ مُرِّ الْخَشَبِ مُرٌّ. أَنَا كُنْتُ جَافَّةٌ وَ مَكْسُورَةٌ لَكِنْ نَطِيفٌ. أَنَا نَبَضْتُ مُقْفِرَةٌ. خَشَبٌ مُرٌّ. هَلْ أَنَا جَرِيبَةٌ؟ أَنَا خَجُولَةٌ أَنَا عِنْدَمَا أَنْتَ لَطِيفٌ. عِنْدَمَا أَنْتَ لِي وَحْدِي نَهْرِي تَدْلُقُ إِلَى زَوْجِي وَ تَنْشُرُ إِلَى دَمُكَ بَلْ. أَنَا أَبْقَى غَفِيَّةٌ أَنْتَ تَضْحَكُ لِي وَحْدِي. أَنْتَ يَجِبُ أَنْ أَنْتَ تَكْسِبُ الْغُمُوضَ أَنْتَ يَجِبُ أَنْ تَكْسِبُ نَهْرِي الْغُمُوضَ تَحْتَ هَذَا مَاءٍ.",
    "transliteration": "Min aṣ-ṣaʿb an anā abtasimu wa anā ashʿuru jāfan. Hal anta taḥīru ghumūḍ. Mughshabah kayfa amkun ashraḥ? Anā lā adfaʿuka yā kayfa anā amkun asraḥ hādhā laka? Yā ʿAbd ar-Raḥīm min mustaḥīl an ansā ṭāwūs. Fī al-maʿbad min ʿiṭr murr al-khashab murr. Anā kuntu jāffah wa maksūrah lākin naṭīf. Anā nabaḍtu muqfirah. Khashab murr. Hal anā jarībah? Anā khajūlah anā ʿindamā anta laṭīf. ʿIndamā anta lī waḥdī nahrī tadluqu ilā zawjī wa tanshuru ilā damuka bal. Anā abqā ghafīyyah anta taḍḥaku lī waḥdī. Anta yajibu an anta taksibu al-ghumūḍ anta yajibu an taksibu nahrī al-ghumūḍ taḥta hādhā māʾ.",
    "english_direct": "From the difficult that I smile and I feel dry. Are you confuse mystery. Foggy how can I explain? I do not push you O how I can I release this to you? O Abd al-Rahim from impossible that I forget peacock. In the temple from perfume bitter the wood bitter. I was dry and broken but clean. I pulsed desolate. Wood bitter. Am I wound? I am shy I when you are kind. When you are to me alone my river pours to my husband and spreads to your blood rather. I stay asleep you laugh to me alone. You must that you win the mystery you must that you win my river the mystery under this water.",
    "english_streamlined": "It's hard for me to smile when I feel dry. Are you confused, mystery? Foggy—how can I explain? I don't push you—oh, how can I release this to you? O Abd al-Rahim, it's impossible for me to forget the peacock. In the temple of bitter perfume, the wood is bitter. I was dry and broken but clean. I pulsed, desolate. Bitter wood. Am I wounded? I am shy when you are kind. When you are mine alone, my river pours to my husband and spreads to your blood instead. I stay asleep, you laugh for me alone. You must win the mystery, you must win my river, the mystery under this water.",
    "spanish": "Es difícil para mí sonreír cuando me siento seca. ¿Estás confundido, misterio? Nebuloso—¿cómo puedo explicar? No te empujo—oh, ¿cómo puedo liberar esto para ti? Oh Abd al-Rahim, es imposible para mí olvidar al pavo real. En el templo de perfume amargo, la madera es amarga. Estaba seca y rota pero limpia. Pulsé, desolada. Madera amarga. ¿Estoy herida? Soy tímida cuando eres amable. Cuando eres solo mío, mi río se derrama a mi esposo y se extiende a tu sangre en su lugar. Me quedo dormida, te ríes solo para mí. Debes ganar el misterio, debes ganar mi río, el misterio bajo esta agua."

  {
    "verse": 18,
    "arabic_vocalized": "هَلْ أَنْتَ تَنْدَمُ تَزَوَّجْنِي؟ هَلْ أَنْتَ تَفْكِرُ أَنَا أَعْمَى وَ غَبِيٌّ؟ هَلْ حُبُّنَا صَبَحَ رَمَادٌ تَحْتَ النَّارِ مِنْ شَوْقِنَا وَ مَسَافَةٌ. أَنْتَ ذَلَلْتَنِي بِسَبَبِ الشَّبَحُ يَقَالُكَ أَنْ. أَنَا رَهَقْتُ وَ مُنْعَزِلَةٌ. يُوجَدُ لَا حَلَاوَةٌ بِالرَّغْمِ مِنْ نَحْنُ مَا زِلْنَا نَدَّعِي. لَكِنْ أَنَا لَا أُرِيدُ أَنْ تَرَكُكَ. أَنَا لَا أُرِيدُ أَنْ هَجَرَ الْحَبِيبَ مِنْ خَيَالِي. هَلْ هُوَ يَكْذِبُ؟ مَا هَذَا؟ كُلَّ الْيَوْمِ نَحْنُ نُشَاجِرُ. الطَّلَاقُ، أَنْتَ تَقَالُنِي. كَلِمَتُكَ يَعْلُقُ أَعْلَاهُ رَأْسِي. مَاذَا أَنَا أَعْمَلُ؟ لِمَاذَا أَنَا أُبَرِّرُ هَذَا. أَنْتَ شُكُوكٌ. أَنْتَ تَفْكِرُ أَنَا لَيْسَ مُتَوَاضِعٌ. أَنَا لَيْسَ عَفِيفٌ. أَنْتَ صَارِمٌ مَعِي. لِمَاذَا أَنْتَ لَا تَثُوقِي؟ أَنْتَ تَفْكِرُ أَنَا أَنَانِيٌّ وَ سَاذِجٌ. لَكِنْ لِمَاذَا، زَوْجِي؟ هَلْ أَنَا لَيْسَ مَا أَنْتَ تُرِيدُ؟",
    "transliteration": "Hal anta tandamu tazawwajnī? Hal anta tafkiru anā aʿmā wa ghabī? Hal ḥubbanā ṣabaḥa ramād taḥta an-nār min shawqinā wa masāfah. Anta dhalaltanī bi-sabab ash-shabaḥ yaqāluka an. Anā rahaqtu wa munʿazilah. Yūjadu lā ḥalāwah bi-r-raghm min naḥnu mā zilnā naddaʿī. Lākin anā lā urīdu an tarakuka. Anā lā urīdu an hajar al-ḥabīb min khayālī. Hal huwa yakdhibu? Mā hādhā? Kulla al-yawm naḥnu nushājir. Aṭ-ṭalāq, anta taqālunī. Kalimatuka yaʿluqu aʿlāhu raʾsī. Mādhā anā aʿmalu? Limādhā anā ubarriru hādhā. Anta shukūk. Anta tafkiru anā laysa mutawāḍiʿ. Anā laysa ʿafīf. Anta ṣārim maʿī. Limādhā anta lā tathūqī? Anta tafkiru anā anānī wa sādhij. Lākin limādhā, zawjī? Hal anā laysa mā anta turīdu?",
    "english_direct": "Do you regret you married me? Do you think I am blind and stupid? Did our love become ash under the fire from our longing and distance. You humiliated me because the ghost tells you that. I am exhausted and isolated. There exists no sweetness although from we still we claim. But I do not want that I leave you. I do not want that I abandon the beloved from my imagination. Does he lie? What is this? All the day we quarrel. The divorce, you tell me. Your word hangs above my head. What do I do? Why I justify this. You are doubts. You think I am not humble. I am not chaste. You are strict with me. Why you do not trust me? You think I am selfish and naive. But why, my husband? Am I not what you want?",
    "english_streamlined": "Do you regret marrying me? Do you think I'm blind and stupid? Has our love become ash under the fire of our longing and distance? You humiliated me because the ghost tells you to. I am exhausted and isolated. There is no sweetness, though we still pretend. But I don't want to leave you. I don't want to abandon the beloved of my imagination. Does he lie? What is this? Every day we quarrel. Divorce—you tell me. Your word hangs above my head. What do I do? Why do I justify this? You are full of doubts. You think I'm not humble. I'm not chaste. You are strict with me. Why don't you trust me? You think I'm selfish and naive. But why, my husband? Am I not what you want?",
    "spanish": "¿Te arrepientes de haberte casado conmigo? ¿Piensas que soy ciega y estúpida? ¿Se ha convertido nuestro amor en ceniza bajo el fuego de nuestro anhelo y distancia? Me humillaste porque el fantasma te lo dice. Estoy exhausta y aislada. No hay dulzura, aunque aún fingimos. Pero no quiero dejarte. No quiero abandonar al amado de mi imaginación. ¿Miente él? ¿Qué es esto? Cada día peleamos. Divorcio—me dices. Tu palabra cuelga sobre mi cabeza. ¿Qué hago? ¿Por qué justifico esto? Estás lleno de dudas. Piensas que no soy humilde. No soy casta. Eres estricto conmigo. ¿Por qué no confías en mí? Piensas que soy egoísta e ingenua. Pero ¿por qué, mi esposo? ¿No soy lo que quieres?"
  },

    "verse": 19,
    "arabic_vocalized": "نَحْنُ فِي وَادِي عَمِيقٌ وَ غَامِقٌ. قُلُوبُنَا ثَقِيلٌ وَ هُنَاكَ مَشَاكِلُ كَثِيرًا. هَذَا لَيْسَ عَادِلٌ. نَحْنُ مَرِيضٌ وَ عَطْشَانٌ لِلشَّغَفِ. هَذَا لَيْسَ عَادِلٌ. كَيْفَ هَذَا قَدَرُنَا؟ أَنَا فَكَّرْتُ الْوَقْتُ كَانَ صَدِيقُنَا. أَيْنَ النَّهْرُ؟ أَيْنَ الْبَحْرُ؟ أَيْنَ الْمَاءُ الْمُقَدَّسُ؟ بِالرَّغْمِ مِنْ كُلِّ هَذَا نَحْنُ هُنَا. نَحْنُ نَدْفَعُ إِلَى أَمَامٍ. أَيْنَ الْحَنَانُ فِي هَذَا صَحْرَاءُ؟ هَلْ نَحْنُ سَنُصَالِحُ وَ هَلْ نَحْنُ سَنَهْرُبُ هَذَا الْكَابُوسُ الْمُقْفِرُ. هَذَا فِرَاقٌ. هَذَا الْمَسَافَةُ. هَلْ حَسْرَتُكَ سَيَتْبَعُنِي إِلَى الْأَبَدِ؟ حَسْرَتِي يَتْبَعُنِي دَائِمًا يَا حَبِيبِي. مَا سَنَعْمَلُ؟ هَذَا مَسَافَةٌ يَقْتُلُنَا. لَوْ سَمَحْتَ. لَوْ سَمَحْتَ حَرَّرْنَا! حَرَّرْنَا. كَيْفَ كُنْ أَنَا أَشْرَحُ كَابُوسٌ؟ مُتَوَاصِلٌ ذَبِيحَةٌ، الْوَعَادُ التَّكْفِيرُ وَ الْحَنُونُ الضَّحْلُ. أَنَا كُنْتُ سَاذِجٌ وَ شَارِدُ الْفِكْرِ. مُمْكِنٌ أَنَا كُنْتُ رَاضٍ بِحُلْمٍ أَنَا حَفَظْتُ مِنَ الْبَدَايَا الْوَقْتُ وَ أَنَا لَمْ كُنْتُ رَيْتُ إِنَّهُ كَانَ يُغَيِّرُ. ذَاكِرَتِي هَشٌّ وَ أَنَا لَيْسَ فُضُولِيٌّ كَافِيَةٌ سَحْفَرُ إِلَى شَيْءٍ ذَلِكَ أَنَا لَا تَسْتَطِيعُ غَلْقٌ. نَابُوءَتِي كَانَ مُلْتَوِي وَ أَنَا كُنْتُ سَكْرَانٌ مَعَ الْحُبِّ مِنْ رَجُلٍ أَنَا لَا عَرَفْتُ. أَنَا لَا أَعْرِفُكَ، أَنَا لَا أَعْرِفُ الرَّجُلَ أَنَا تَزَوَّجْتُ. أَنَا أَصَلِّي نَحْنُ سَنَنْحَرِرُ مِنَ الذَّنْبِ. هُوَ وَسِيمٌ جِدًّا وَ مُتْقَنٌ أَنَا أَصْبَحُ أَعْمَى إِلَى طُقُوسِ الدَّمِ وَ الشَّيَاطِينُ يَلْعَبُ فِي سَرِيرِنَا. مَتَى أَنَا مَبْلُولٌ أَنَا أَشْعُرُ وَسِخٌ. قَلْبِي يَشْعُرُ فَارِغٌ وَ أَنَا أَشْعُرُ لَا سُرُورٌ فِي صُنْعِ الْحُبِّ مَعَكَ بِسَبَبِ شَغَافُنَا لَيْسَ خُصُوصِيٌّ. عُيُونُكَ لَيْسَ عَلَيَّ. هَذَا فِي سَبِيلِ هُمْ. لَيْسَ أَنَا، لَيْسَ لَكَ، لَيْسَ نَحْنُ. أَنَا أَسْكُتُ لَكِنْ أَنَا عَصَبِيٌّ. الرِّيحُ غَاضِبٌ. رَعْدٌ يَزْعُقُ عَبْرَ السَّمَاءِ الْمُظْلِمِ. أَنَا مَا بَيْنَ جِبَالٍ اثْنَيْنِ. عَمِيقٌ فِي الْوَادِي الْعَتِيقِ مِنَ التَّكْفِيرِ. أَنَا أَذْكُرُ مَتَى نَحْنُ مَعًا. مَتَى نَحْنُ كُنْتُ جَدِيدٌ. نَحْنُ كُنْتُ عَرُوسَانٌ. وَرَائِي، أَنَا أَسْمَعُ الضِّبَاعَ تَضْحَكُ، تَرَنَّمُ، تَنْشُرُ طُولَ مَعَ الْعَاصِفَةِ. أَسْرَارٌ يَغْزُو هَذَا أَرْضٌ مِنْ أَشْبَاحٍ جَائِعٌ. وَجْهُكَ أَنَا حَفَظُ عَنْ ظَهْرِ قَلْبٍ. هَيْكَلُ عَظْمِيكَ، دَمُكَ. أَنَا حَفَظُ عَنْ ظَهْرِ قَلْبٍ بَشْرَاتُكَ وَ كُلُّ عَضْلَةٌ. أَنْتَ زَوْجِي. لِمَاذَا أَنْتَ لَيْسَ مَعِي؟ أَنَا أَشْعُرُ فَجْأَةً وَحِيدٌ. هَذِهِ الْحَوَاجِزُ لَا هَوَادَةَ فِيهَا مَا بَيْنَنَا. مَتَى نَحْنُ سَكْسِرُ هَذَا قُيُودٌ الْمُرِّ؟ شَوْقِي وَ لَوْعَتِي. هُمَا يَتْبَعَانِنِي إِلَى هَذَا صَحْرَاءُ غَمُوقٌ وَ فَارِغٌ. مِنَ السَّهْلِ أَنْ نَسِيَ أَيْنَ أَنَا مِنْ. ذَالِكَ لَيْسَ أَنَا بَكَى مُقْفِرٌ وَ ظَمْآنٌ. شَوْقِي وَ لَوْعَتِي. أَنْتَ خَدَعْتَنِي. لَقَدْ كَرَسْتُ لَكَ. أَنْتَ رَوَّضْتَنِي وَ تَتَخَلَّى. أَنْتَ هَجَرْتَنِي كُلُّ وَحِيدٌ إِلَى تَبَعَ شَيْءٍ أَنَا لَا أَفْهَمُ. إِنَّ مُظْلِمٌ وَ مُرْعِبٌ. رُعْبٌ. إِنَّهُ يُضَايِقُنِي. إِنَّهُ يُرِيدُ سَيُذَلِّلُنِي",
    "transliteration": "Naḥnu fī wādī ʿamīq wa ghāmiq. Qulūbunā thaqīl wa hunāka mashākil kathīran. Hādhā laysa ʿādil. Naḥnu marīḍ wa ʿaṭshān li-sh-shaghaf. Hādhā laysa ʿādil. Kayfa hādhā qadarunā? Anā fakkartu al-waqt kāna ṣadīqunā. Ayna an-nahr? Ayna al-baḥr? Ayna al-māʾ al-muqaddas? Bi-r-raghm min kulli hādhā naḥnu hunā. Naḥnu nadfaʿu ilā amām. Ayna al-ḥanān fī hādhā ṣaḥrāʾ? Hal naḥnu sa-nuṣāliḥu wa hal naḥnu sa-nahrubu hādhā al-kābūs al-muqfir. Hādhā firāq. Hādhā al-masāfah. Hal ḥasratuka sa-yatabaʿunī ilā al-abad? Ḥasratī yatabaʿunī dāʾiman yā ḥabībī. Mā sa-naʿmalu? Hādhā masāfah yaqtulunā. Law samaḥta. Law samaḥta ḥarrarnā! Ḥarrarnā. Kayfa kun anā ashraḥ kābūs? Mutawāṣil dhabīḥah, al-waʿād at-takfīr wa al-ḥanūn aḍ-ḍaḥl. Anā kuntu sādhij wa shārid al-fikr. Mumkin anā kuntu rāḍin bi-ḥulm anā ḥafaẓtu min al-badāyā al-waqt wa anā lam kuntu raytu innahu kāna yughayyir. Dhākiratī hashsh wa anā laysa fuḍūlī kāfiyah saḥfaru ilā shayʾ dhālika anā lā tastaṭīʿu ghalq. Nābūʾatī kāna multawī wa anā kuntu sakrān maʿa al-ḥubb min rajul anā lā ʿaraftu. Anā lā aʿrifuka, anā lā aʿrifu ar-rajul anā tazawwajtu. Anā aṣallī naḥnu sa-nanḥariru min adh-dhanb. Huwa wasīm jiddan wa mutqan anā aṣbaḥu aʿmā ilā ṭuqūs ad-dam wa ash-shayāṭīn yalʿab fī sarīrinā. Matā anā mablūl anā ashʿuru wasikh. Qalbī yashʿuru fārigh wa anā ashʿuru lā surūr fī ṣunʿ al-ḥubb maʿaka bi-sabab shaghāfunā laysa khuṣūṣī. ʿUyūnuka laysa ʿalayya. Hādhā fī sabīl hum. Laysa anā, laysa laka, laysa naḥnu. Anā askutu lākin anā ʿaṣabī. Ar-rīḥ ghāḍib. Raʿd yazʿuqu ʿabra as-samāʾ al-muẓlim. Anā mā bayna jibāl ithnayn. ʿAmīq fī al-wādī al-ʿatīq min at-takfīr. Anā adhkuru matā naḥnu maʿan. Matā naḥnu kuntu jadīd. Naḥnu kuntu ʿarūsān. Warāʾī, anā asmaʿu aḍ-ḍibāʿ taḍḥaku, tarannam, tanshuru ṭūl maʿa al-ʿāṣifah. Asrār yaghzū hādhā arḍ min ashbāḥ jāʾiʿ. Wajhuka anā ḥafaẓu ʿan ẓahr qalb. Haykal ʿaẓmīka, damuka. Anā ḥafaẓu ʿan ẓahr qalb bashrātuka wa kullu ʿaḍlah. Anta zawjī. Limādhā anta laysa maʿī? Anā ashʿuru fajʾatan waḥīd. Hādhihi al-ḥawājiz lā hawādah fīhā mā baynanā. Matā naḥnu sa-naksiru hādhā quyūd al-murr? Shawqī wa lawʿatī. Humā yatabaʿāninnī ilā hādhā ṣaḥrāʾ ghamūq wa fārigh. Min as-sahl an nasiya ayna anā min. Dhālika laysa anā bakā muqfir wa ẓamʾān. Shawqī wa lawʿatī. Anta khadaʿtanī. Laqad karastu laka. Anta rawwaḍtanī wa tatakhallā. Anta hajartanī kullu waḥīd ilā tabaʿa shayʾ anā lā afhamu. Inna muẓlim wa murʿib. Ruʿb. Innahu yuḍāyiqunī. Innahu yurīdu sa-yudhalilunī",

e bitter chains? My longing and my anguish. They follow me to this deep and empty desert. It's easy to forget where I'm from. That's not me crying, desolate and thirsty. My longing and my anguish. You deceived me. I devoted myself to you. You tamed me and abandoned me. You left me all alone to follow something I don't understand. It is dark and terrifying. Terror. It bothers me. It wants to humiliate me.",
    "spanish": "Estamos en un valle profundo y oscuro. Nuestros corazones están pesados y hay muchos problemas. Esto no es justo. Estamos enfermos y sedientos de pasión. Esto no es justo. ¿Cómo es este nuestro destino? Pensé que el tiempo era nuestro amigo. ¿Dónde está el río? ¿Dónde está el mar? ¿Dónde está el agua sagrada? A pesar de todo esto, estamos aquí. Empujamos hacia adelante. ¿Dónde está la ternura en este desierto? ¿Nos reconciliaremos y escaparemos de esta pesadilla desolada? Esto es separación. Esta es la distancia. ¿Tu arrepentimiento me seguirá para siempre? Mi arrepentimiento me sigue siempre, oh mi amor. ¿Qué haremos? Esta distancia nos mata. Por favor. ¡Por favor libéranos! Libéranos. ¿Cómo puedo explicar esta pesadilla? Sacrificio continuo, la promesa de expiación, y ternura superficial. Era ingenua y distraída. Quizás estaba satisfecha con un sueño que guardé desde el principio del tiempo, y no vi que estaba cambiando. Mi memoria es frágil y no soy lo suficientemente curiosa para cavar en algo que no puedo cerrar. Mi profecía estaba retorcida y estaba ebria de amor por un hombre que no conocía. No te conozco, no conozco al hombre con quien me casé. Rezo para que seamos liberados del pecado. Él es tan guapo y perfecto, me volví ciega al ritual de sangre y a los demonios jugando en nuestra cama. Cuando estoy mojada me siento sucia. Mi corazón se siente vacío y no siento placer al hacer el amor contigo porque nuestra pasión no es privada. Tus ojos no están en mí. Esto es para ellos. No yo, no tú, no nosotros. Estoy en silencio pero estoy nerviosa. El viento está enojado. El trueno grita a través del cielo oscuro. Estoy entre dos montañas. Profundo en el valle antiguo de la expiación. Recuerdo cuando estábamos juntos. Cuando éramos nuevos. Éramos recién casados. Detrás de mí, escucho a las hienas reír, tararear, extenderse junto con la tormenta. Los secretos invaden esta tierra de fantasmas hambrientos. Guardo tu rostro de memoria. Tu esqueleto, tu sangre. Guardo tu piel y cada músculo de memoria. Eres mi esposo. ¿Por qué no estás conmigo? Me siento repentinamente sola. Estas barreras entre nosotros no tienen piedad. ¿Cuándo romperemos estas cadenas amargas? Mi anhelo y mi angustia. Me siguen a este desierto profundo y vacío. Es fácil olvidar de dónde soy. Esa no soy yo llorando, desolada y sedienta. Mi anhelo y mi angustia. Me engañaste. Me dediqué a ti. Me domaste y me abandonaste. Me dejaste completamente sola para seguir algo que no entiendo. Es oscuro y aterrador. Terror. Me molesta. Quiere humillarme."

    "verse": 20,
    "arabic_vocalized": "قَلْبِي يَشْعُرُ هَشٌّ وَ فَارِغٌ هَذَا اللَّيْلَ. أَنَا لَا أَعْرِفُ مَا أَنَا سَأَفْعَلُ. أَنَا يَجِبُ أَنْ سَأَكُونُ حَاذِرٌ وَ مُتَوَافِقٌ. أَنَا يَجِبُ أَغَيِّرُ قَدَرِي. أَنَا يَجِبُ أَنْ لَا أَسْكُتُ وَ أَصْدُقُ مَا الْمَصَّاصُ دِمَاءٍ يَقُولُلِي. أَنَا يَجِبُ أَنْ لَا أَفْشَلُ فِي سَأَكُونُ لَامِعٌ وَ عَنِيفٌ وَ قَوِيٌّ. أَنَا يَجِبُ أَنْ سَرِيعٌ وَ حَيَوِيَّةٌ، نَهْرُ الْمُقَدَّسِ مِنَ الْهِيَّةِ أَنَانَنَّا. مِنَ الْأَحْسَنِ أَنْ ذَلِكَ أَنَا أَكُونُ بِخَيْبَةٍ بَدَلًا مِنْ ثَابِتٌ فِي حُلْمِ الْخَاطِئِ. هَلْ أَنْتَ سَتَمْسِكُنِي؟ هَلْ أَنْتَ حَبِيبِي الشَّهْمُ؟ هَلْ أَنْتَ سَتَكْسِرُ الْبَوَّابَةَ طَلُكَ أَيْ يَقْسِمُنَا؟ مَتَى قَدَرُنَا سَيَكُونُ نِهَائِيٌّ؟ تَارِيخُنَا أَحْجِيَةٌ مُتَنَاقِصٌ وَ أَنَا شُكُوكٌ بِبِسَبِ ضَيْمٌ مُعَدٌّ. إِنَّهُ يُخْفِي حَنَانَنَا تَحْتَ كَلَامَاتِنَا الْحَامِضُ. أَيْنَ الرَّجُلُ الَّذِي عَطِينِي الْهَدِيَّةَ مِنْ تَكْفِيرٍ ذَلِكَ تِلْكَ اللَّحْظَةُ الْوَحِيدُ فِي الْوَقْتِ أَنَا صَدَّقْتُ فِي أَنْتَ وَ نَحْنُ وَ الْحُبُّ الْمُقَدَّسُ؟ أَيْنَ تِلْكَ اللَّحْظَةُ؟ مَتَى نَحْنُ سَنَتَصَالَحُ هَذَا الْكَابُوسُ غَرِيبٌ مَعَ قِصَّتِنَا الصَّحِيحُ؟ كَيْفَ نَحْنُ سَنَعْرِفُ؟ مَتَى سَنَصْدُقُ مَا مِنَ الْأَمَامِ مِنْ عُيُونِنَا وَ لَيْسَ مَاذَا الشَّبَحُ الْغَيُورُ قُولُ لَنَا مِنْ وَرَاءِ الظِّلَالِ فِي الْوَادِي نَحْنُ نُحَاوِلُ نَهْرُبُ. إِنَّهُ كَفِيَّةٌ",
    "transliteration": "Qalbī yashʿuru hashsh wa fārigh hādhā al-layl. Anā lā aʿrifu mā anā sa-afʿalu. Anā yajibu an sa-akūnu ḥādhir wa mutawāfiq. Anā yajibu ughayyiru qadarī. Anā yajibu an lā askutu wa aṣduqu mā al-maṣṣāṣ dimāʾ yaqūlulī. Anā yajibu an lā afshalu fī sa-akūnu lāmiʿ wa ʿanīf wa qawī. Anā yajibu an sarīʿ wa ḥayawīyyah, nahru al-muqaddas min al-hiyyah Anānannā. Min al-aḥsan an dhālika anā akūnu bi-khaybah badalan min thābit fī ḥulm al-khāṭiʾ. Hal anta sa-tamsikunī? Hal anta ḥabībī ash-shahm? Hal anta sa-taksiru al-bawwābah ṭaluka ayy yaqsimunā? Matā qadarunā sa-yakūnu nihāʾī? Tārīkhunā aḥjiyah mutanāqiṣ wa anā shukūk bi-bisab ḍaym muʿadd. Innahu yukhfī ḥanānanā taḥta kalāmātinā al-ḥāmiḍ. Ayna ar-rajul alladhī ʿaṭīnī al-hadiyyah min takfīr dhālika tilka al-laḥẓah al-waḥīd fī al-waqt anā ṣaddaqtu fī anta wa naḥnu wa al-ḥubb al-muqaddas? Ayna tilka al-laḥẓah? Matā naḥnu sa-nataṣālaḥu hādhā al-kābūs gharīb maʿa qiṣṣatinā aṣ-ṣaḥīḥ? Kayfa naḥnu sa-naʿrifu? Matā sa-naṣduqu mā min al-amām min ʿuyūninā wa laysa mādhā ash-shabaḥ al-ghayūr qūl lanā min warāʾ aẓ-ẓilāl fī al-wādī naḥnu nuḥāwilu nahrubu. Innahu kafīyyah",
    "english_direct": "My heart feels fragile and empty this the night. I do not know what I will do. I must that I will be careful and compatible. I must change my fate. I must that not I am silent and believe what the vampire tells me. I must that not I fail in I will be shining and violent and strong. I must that fast and vitality, river the sacred from the deity Inanna. From the better that that I am with disappointment instead from fixed in dream the wrong. Will you hold me? Are you my love the gallant? Will you break the gate your spell which divides us? When our fate will be final? Our history puzzle decreasing and I am doubts because injustice prepared. It hides our tenderness under our words the sour. Where is the man who gave me the gift from atonement that that moment the only in the time I believed in you and us and the love the sacred? Where is that moment? When we will reconcile this nightmare strange with our story the correct? How we will know? When will we believe what from the front from our eyes and not what the ghost the jealous says us from behind the shadows in the valley we try escape. It is enough",
    "english_streamlined": "My heart feels fragile and empty this night. I don't know what I will do. I must be careful and aligned. I must change my fate. I must not be silent and believe what the vampire tells me. I must not fail to be shining and fierce and strong. I must be fast and vital, the sacred river of the goddess Inanna. It's better that I be disappointed than fixed in the wrong dream. Will you hold me? Are you my gallant love? Will you break the gate, your spell that divides us? When will our fate be final? Our history is a diminishing puzzle and I am full of doubts because of prepared injustice. It hides our tenderness under our sour words. Where is the man who gave me the gift of atonement, that one moment in time when I believed in you and us and sacred love? Where is that moment? When will we reconcile this strange nightmare with our true story? How will we know? When will we believe what is in front of our eyes and not what the jealous ghost tells us from behind the shadows in the valley we're trying to escape? It is enough.",
    "spanish": "Mi corazón se siente frágil y vacío esta noche. No sé qué haré. Debo ser cuidadosa y alineada. Debo cambiar mi destino. No debo estar en silencio y creer lo que el vampiro me dice. No debo fallar en ser brillante y feroz y fuerte. Debo ser rápida y vital, el río sagrado de la diosa Inanna. Es mejor que esté decepcionada que fija en el sueño equivocado. ¿Me sostendrás? ¿Eres mi amor galante? ¿Romperás la puerta, tu hechizo que nos divide? ¿Cuándo será final nuestro destino? Nuestra historia es un rompecabezas decreciente y estoy llena de dudas por la injusticia preparada. Esconde nuestra ternura bajo nuestras palabras agrias. ¿Dónde está el hombre que me dio el regalo de la expiación, ese único momento en el tiempo cuando creí en ti y en nosotros y en el amor sagrado? ¿Dónde está ese momento? ¿Cuándo reconciliaremos esta pesadilla extraña con nuestra verdadera historia? ¿Cómo sabremos? ¿Cuándo creeremos lo que está frente a nuestros ojos y no lo que el fantasma celoso nos dice desde detrás de las sombras en el valle del que intentamos escapar? Es suficiente."

  {
    "verse": 21,
    "arabic_vocalized": "لِمَاذَا أَنْتَ يُطَارِدُنِي؟ أَنْتَ كُنْتَ حُبِّي الْمُقَدَّسُ لَكِنْ الْآنَ أَنْتَ كَابُوسٌ فِي الصَّحْرَةِ مِنْ تَارِيخِي مَرَضٌ. أَنَا يَعْسُوبٌ وَ أَنَا ذَكِيٌّ وَ سَرِيعٌ! أَنْتَ سَتَدْفَعُ السِّعْرَ. أَنَا كَسَرْتُ سَرَابُكَ وَ أَنَا حَرَّرْتُ نَفْسِي بِالرَّغْمِ مِنْ أَنْتَ مُعْدِي. الْعَارُ يَنْكَمِشُ وَ يَسْقُطُ إِلَى الْمَاءِ. أَنْتَ لَا سَتَتَجِدُنِي أَيْنَمَا عُيُونُكَ يَبْحَثُ. أَنَا لَيْسَ مَعُكَ.",
    "transliteration": "Limādhā anta yuṭāridunī? Anta kunta ḥubbī al-muqaddas lākin al-ān anta kābūs fī aṣ-ṣaḥrah min tārīkhī maraḍ. Anā yaʿsūb wa anā dhakī wa sarīʿ! Anta sa-tadfaʿu as-siʿr. Anā kasartu sarābuka wa anā ḥarrartu nafsī bi-r-raghm min anta muʿdī. Al-ʿār yankamishu wa yasquṭu ilā al-māʾ. Anta lā sa-tatajidunī aynamā ʿuyūnuka yaḥbathu. Anā laysa maʿuka.",
    "english_direct": "Why you chase me? You were my love the sacred but now you are nightmare in the desert from my history disease. I am dragonfly and I am smart and fast! You will pay the price. I broke your mirage and I freed myself although from you are contagious. The shame shrinks and falls to the water. You will not find me wherever your eyes search. I am not with you.",
    "english_streamlined": "Why do you chase me? You were my sacred love but now you are a nightmare in the desert of my diseased history. I am a dragonfly and I am smart and fast! You will pay the price. I broke your mirage and I freed myself even though you are contagious. The shame shrinks and falls to the water. You will not find me wherever your eyes search. I am not with you.",
    "spanish": "¿Por qué me persigues? Eras mi amor sagrado pero ahora eres una pesadilla en el desierto de mi historia enferma. Soy una libélula y soy inteligente y rápida. Pagarás el precio. Rompí tu espejismo y me liberé aunque seas contagioso. La vergüenza se encoge y cae al agua. No me encontrarás dondequiera que tus ojos busquen. No estoy contigo."

  {
    "verse": 22,
    "arabic_vocalized": "فِي بَيْتِي. النُّورُ مِنَ الْقَمَرِ...فِي بَيْتِي!... فِي بَيْتِي! فِي بَيْتِي، السَّمَاءُ مَجِيدٌ. النُّورُ مِنَ الْقَمَرِ فِي بَيْتِي...فِي بَيْتِي... إِنَّهُ مَيِّتٌ. أَنَا النَّابُو. أَنَا أَكْتُبُ النُّجُومَ لَكَ. فَقَطْ لَكَ أَنَا أَقَالُ الْحَقِيقَةَ. فَقَطْ لَكَ، الْحَقِيقَةُ بِدُونَ الْإِكِيبُو. إِنَّهُ يَتِمُّ دَمِيرُهُ... أَنَا أَكْرَهُهُ. مِنْ هُوَ؟ هَذَا شَبَحٌ، هَذَا شَيْطَانٌ...مِنْ هُوَ؟ لِمَاذَا؟ أَنَا فَكَّرْتُ أَنْتَ لَقَدْ صَدِيقِي لَكِنْ لَا! أَنْتَ...يَا أَنْتَ... أَنْتَ شَغَقْتَ أَنْ تَأْكُلُنِي... كُلَّ الْوَقْتِ...مِنَ الْوَقْتِ الْعَتِيقِ. أَنَا لَا أَعْرِفُ كَيْفَ أَنْتَ فَعَلْتَ ذَلِكَ...كَيْفَ أَنْتَ فَعَلْتَ هَذَا لِي؟",
    "transliteration": "Fī baytī. An-nūr min al-qamar...fī baytī!... Fī baytī! Fī baytī, as-samāʾ majīd. An-nūr min al-qamar fī baytī...fī baytī... Innahu mayyit. Anā an-Nābū. Anā aktubu an-nujūm laka. Faqaṭ laka anā aqālu al-ḥaqīqah. Faqaṭ laka, al-ḥaqīqah bidūn al-Ikībū. Innahu yatimmu damīruhu... Anā akrahuhu. Min huwa? Hādhā shabaḥ, hādhā shayṭān...min huwa? Limādhā? Anā fakkartu anta laqad ṣadīqī lākin lā! Anta...yā anta... Anta shaghaqta an taʾkulunī... Kulla al-waqt...min al-waqt al-ʿatīq. Anā lā aʿrifu kayfa anta faʿalta dhālika...kayfa anta faʿalta hādhā lī?",
    "english_direct": "In my house. The light from the moon...in my house!... In my house! In my house, the sky glorious. The light from the moon in my house...in my house... It is dead. I am the Nabu. I write the stars for you. Only for you I say the truth. Only for you, the truth without the Ekibu. It is being destroyed... I hate it. Who is he? This is ghost, this is devil...who is he? Why? I thought you have been my friend but no! You...O you... You desired that you eat me... All the time...from the time the ancient. I do not know how you did that...how you did this to me?",
    "english_streamlined": "In my house. The light from the moon...in my house!... In my house! In my house, the sky is glorious. The light from the moon in my house...in my house... It is dead. I am Nabu. I write the stars for you. Only for you I tell the truth. Only for you, the truth without the Ekibu. It is being destroyed... I hate it. Who is he? This is a ghost, this is a devil...who is he? Why? I thought you were my friend but no! You...oh you... You desired to eat me... All the time...from ancient times. I don't know how you did that...how did you do this to me?",
    "spanish": "En mi casa. La luz de la luna...¡en mi casa!... ¡En mi casa! En mi casa, el cielo es glorioso. La luz de la luna en mi casa...en mi casa... Está muerto. Soy Nabu. Escribo las estrellas para ti. Solo para ti digo la verdad. Solo para ti, la verdad sin el Ekibu. Está siendo destruido... Lo odio. ¿Quién es él? Esto es un fantasma, esto es un demonio...¿quién es él? ¿Por qué? Pensé que eras mi amigo pero ¡no! Tú...oh tú... Deseabas comerme... Todo el tiempo...desde tiempos antiguos. No sé cómo hiciste eso...¿cómo me hiciste esto?"

  {
    "verse": 23,
    "arabic_vocalized": "مَاءٌ فِي الصَّحْرَاءِ مُلَوَّثَةٌ. الْمَاءُ مُلَوَّثَةٌ! أَنَا لَا أَفْهَمُ! لِمَاذَا...لَمْ الْمَاءُ لَيْسَ نَفْسٌ؟ هَذَا مَاءٌ أَسْوَدُ وَ مَيِّتٌ وَ تَحْتَ هَذِهِ مَاءٌ عُيُونٌ. عُيُونٌ تَبَعُنِي عُيُونٌ غَرِيبٌ عُيُونٌ بَارِدٌ بَعْدَ مَأْلُوفٌ. بِطَرِيقَةٍ مَا عُيُونٌ مُطْمَئِنٌّ. هَذِهِ عُيُونُ الْغُمُوضِ تَبَعُنِي إِلَى الْأَبَدِ تَحْتَ الْمَاءِ، عُيُونٌ تَحْتَ الْمَاءِ! مَذَا عَلَى أَنْ أَفْعَلُ؟",

    "english_direct": "Water in the desert polluted. The water polluted! I do not understand! Why...why the water is not same? This is water black and dead and under this water eyes. Eyes follow me eyes strange eyes cold yet familiar. Somehow eyes reassuring. These eyes the mystery follow me to the forever under the water, eyes under the water! What upon that I do?",

  {
    "verse": 24,
    "arabic_vocalized": "مِنَ الدَّاخِلِ أَنَا دَافِئٌ وَ ضَيِّقٌ. أَنَا مَبْلُولٌ وَ حَنُونٌ. أَنَا امْرَأَةٌ وَ بَظْرِي سَكْرَانٌ فِي السِّجْنِ. مِنْ يَمْلِكُ الْمِفْتَاحَ؟ مِنْ يَدْفَعُ السِّعْرَ؟ شَرِيكِي الْمُسَاوِ، زَوْجِي الْمُطَابِقُ فِي الْفُرَاتِ. قَدَرِي الْمَحْتُومُ. مَتَى أَنْتَ تَضُمُّ مَعِي؟ كُلُّ شَيْءٍ لَيْسَ طَبِيعِيٌّ، أَنَا رَحَّالُ الْوَحِيدُ هُنَا. مَتَى أَنْتَ سَوَصِلُ؟ فِي الْفُرَاتِ، بَعْدَ الْفَيَضَانِ.",
    "transliteration": "Min ad-dākhil anā dāfiʾ wa ḍayyiq. Anā mablūl wa ḥanūn. Anā imraʾah wa baẓrī sakrān fī as-sijn. Min yamliku al-miftāḥ? Min yadfaʿu as-siʿr? Sharīkī al-musāwī, zawjī al-muṭābiq fī al-Furāt. Qadarī al-maḥtūm. Matā anta taḍummu maʿī? Kullu shayʾ laysa ṭabīʿī, anā raḥḥāl al-waḥīd hunā. Matā anta sa-waṣil? Fī al-Furāt, baʿda al-fayḍān.",

    "english_streamlined": "From the inside I am warm and tight. I am wet and tender. I am a woman and my clitoris is drunk in prison. Who owns the key? Who pays the price? My equal partner, my matching husband in the Euphrates. My inevitable fate. When will you embrace me? Everything is unnatural, I am the lone nomad here. When will you arrive? In the Euphrates, after the flood.",

    "transliteration": "Qaḍīb ṣaghīr. Al-waḥsh. Hābīl. Al-qadhirah. ʿAṣā. Fī al-barrīyyah. Al-hawāmm. Aṣl ṣaghīr. Al-waḍʿ ḥālīyan. Anā afkurulahu bi-sabab huwa kallamatlī. Anā mā ʿinda fikrah kayfa huwa kasarat ath-thalj baynanā lākin huwa faʿal. Sarīʿ, laqad ṣabaḥat bāridah wa anā kuntu āmin marrah ukhrā. Laqad ṣanaʿtu al-māʾ bārid jiddan wa innahu ṣabaḥat thalj marrah ukhrā. Li-hādhā as-sabab huwa laysa yakallimulī al-ān. Al-hādhā al-basabab huwa ṣāmit al-ān. Anā akrahuhu jiddan baʿḍ al-aḥyān anā aṣbaḥu majnūn wa ghāḍibah wa ḥalqī yamlaʾu bi-ḍ-ḍaghṭ. Mādhā yumkinunī an afʿalu? Huwa kāna sharr jiddan wa huwa kāna qāsiyah wa anānīyyah. Anā ashghafu abṣuqu ilā famuhu wa ilā ʿuyūnuhu kulla as-summ wa al-kurh huwa jabartu ilā asfal qalbī. Ṭiflī dākhilī bakā kulla laylah wa yawm bidūn kulli al-ḥubb huwa waʿadatnī. Anā ashghafu sa-aṭlubuhu limādhā lākin anā aʿrifu huwa kadhab. Kullu huwa tafʿalu kadhab. Hādhā kullu huwa sa-faʿlu ilā al-abad.",
