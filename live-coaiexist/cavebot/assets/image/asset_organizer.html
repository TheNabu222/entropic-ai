<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavebot Asset Organizer</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #f0f0f0;
            font-family: sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .controls {
            background: #333;
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #555;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }

        button:hover {
            background: #005f9e;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .card {
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .img-container {
            height: 180px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            position: relative;
        }

        .img-container img {
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
        }

        .info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 12px;
        }

        .filename {
            color: #aaa;
            word-break: break-all;
            margin-bottom: 4px;
        }

        select,
        input {
            padding: 5px;
            background: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        textarea.output {
            width: 100%;
            height: 150px;
            background: #111;
            color: #0f0;
            font-family: monospace;
            padding: 10px;
            display: none;
            margin-top: 20px;
        }
    </style>
</head>

        const categories = [
            { val: "", label: "-- Keep Location --" },
            { val: "backdrops", label: "Backdrops" },
            { val: "sprites", label: "Sprites" },
            { val: "icons", label: "Icons" },
            { val: "props", label: "Props" },
            { val: "ui:ux", label: "UI / UX" },
            { val: "deck", label: "Deck" }
        ];

        const container = document.getElementById('grid');
        document.getElementById('count').innerText = allFiles.length;

        allFiles.forEach((info, idx) => {
            // info is the relative path, e.g. "unsorted/image.png"
            const parts = info.split('/');
            const filename = parts.pop();
            const currentDir = parts.join('/'); // directory path

            const card = document.createElement('div');
            card.className = 'card';

            // Image
            const imgDiv = document.createElement('div');
            imgDiv.className = 'img-container';
            const img = document.createElement('img');
            img.src = info; // Relative path
            img.title = info;
            imgDiv.appendChild(img);

            // Info
            const infoDiv = document.createElement('div');
            infoDiv.className = 'info';

            const nameLabel = document.createElement('div');
            nameLabel.className = 'filename';
            nameLabel.innerText = filename;
            nameLabel.title = info; // Full path on hover

            // Category Select
            const catSelect = document.createElement('select');
            catSelect.id = `cat-${idx}`;
            categories.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.val;
                opt.innerText = c.label;
                catSelect.appendChild(opt);
            });

            // Hint at current location in the first option
            catSelect.options[0].text = `Current: ${currentDir}`;

            // New Name Input
            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            // Pre-fill with current name (without extension) for easier editing
            // Handle names with dots correctly (only remove last extension)
            const nameWithoutExt = filename.replace(/\.[^/.]+$/, "");
            nameInput.value = nameWithoutExt;
            nameInput.id = `name-${idx}`;

            infoDiv.appendChild(nameLabel);
            infoDiv.appendChild(catSelect);
            infoDiv.appendChild(nameInput);

            card.appendChild(imgDiv);
            card.appendChild(infoDiv);

            container.appendChild(card);
        });

        function generateScript() {
            let script = "#!/bin/bash\n\n";
            let count = 0;

            allFiles.forEach((file, idx) => {
                const cat = document.getElementById(`cat-${idx}`).value;
                let newName = document.getElementById(`name-${idx}`).value.trim();
                const originalNameWithoutExt = file.split('/').pop().replace(/\.[^/.]+$/, "");

                // Check if user changed something
                const isCategoryChanged = cat !== "";
                const isNameChanged = newName !== originalNameWithoutExt;

                if (isNameChanged || isCategoryChanged) {
                    // Determine target directory
                    // If cat is empty, use the original directory
                    let targetDir = cat;
                    if (!targetDir) {
                        // Extract original dir
                        const parts = file.split('/');
                        parts.pop();
                        targetDir = parts.join('/');
                    }

                    // Sanitize new name to be safe
                    // Allow letters, numbers, hyphens, underscores
                    newName = newName.replace(/[^a-zA-Z0-9-_]/g, '_');

                    // Get extension
                    const ext = file.split('.').pop();

                    // Construct command
                    // quoted paths to handle spaces
                    script += `mv "${file}" "${targetDir}/${newName}.${ext}"\n`;
                    count++;
                }
            });

            if (count === 0) {
                alert("No changes detected.");
                return;
            }

            const out = document.getElementById('output');
            out.value = script;
            out.style.display = 'block';
            out.select();
            document.execCommand('copy');
            alert(`Generated commands for ${count} files. Copied to clipboard!`);
            window.scrollTo(0, 0);
        }

    </script>
</body>
