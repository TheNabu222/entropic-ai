<style>
.win98-taskbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:40px;
  z-index:2147483646; /* bottom bar */
  background:linear-gradient(to bottom,#c0c0c0 0%,#808080 100%);
  border-top:2px solid #fff;
  display:flex;
  align-items:center;
  padding:0 4px;
  font-family:"MS Sans Serif",Arial,sans-serif;
  font-size:11px;
  box-shadow:0 -2px 4px rgba(0,0,0,.3);
  overflow-x:auto;
  overflow-y:visible;
}

.taskbar-button{
  background:linear-gradient(to bottom,#dfdfdf 0%,#c0c0c0 100%);
  border:2px outset #fff;
  padding:4px 8px;
  margin:0 2px;
  cursor:pointer;
  color:#000;
  text-decoration:none;
  display:inline-block;
  font-weight:bold;
  transition:.1s;
  white-space:nowrap;
}
.taskbar-button:hover{
  background:linear-gradient(to bottom,#e0e0e0 0%,#d0d0d0 100%);
}
.taskbar-button:active{
  border-style:inset;
  background:#c0c0c0;
}

.taskbar-start{
  background:linear-gradient(to right,#008080,#0000ff);
  color:#fff;
  font-weight:bold;
  padding:4px 12px;
  margin-right:8px;
  border:2px outset #fff;
  cursor:pointer;
  text-decoration:none;
  display:inline-block;
  white-space:nowrap;
}

.taskbar-separator{
  width:2px;
  height:30px;
  background:#808080;
  margin:0 4px;
  flex-shrink:0;
}

.taskbar-button.active{
  outline:2px solid #000;
  box-shadow:inset 0 0 0 2px #fff;
}

.taskbar-counter{
  margin-left:auto;
  background:#c0c0c0;
  border:2px inset #fff;
  padding:4px 8px;
  font-size:11px;
  font-weight:bold;
  flex-shrink:0;
}

/* Hamburger menu button (hidden by default on desktop) */
.taskbar-hamburger{
  display:none;
  background:linear-gradient(to bottom,#dfdfdf 0%,#c0c0c0 100%);
  border:2px outset #fff;
  padding:6px 10px;
  margin:0 4px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  flex-shrink:0;
}
.taskbar-hamburger:active,
.taskbar-hamburger.is-open{
  border-style:inset;
  background:#c0c0c0;
}

/* Mobile menu container (overlay above content) */
.taskbar-mobile-menu{
  display:none;
  position:fixed;
  left:0;
  right:0;
  bottom:40px;
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  background:linear-gradient(to bottom,#c0c0c0 0%,#808080 100%);
  border-top:2px solid #fff;
  box-shadow:0 -2px 4px rgba(0,0,0,.3);
  padding:8px 4px;
  z-index:2147483647; /* menu above bar + page */
}
.taskbar-mobile-menu.open{
  display:block;
}

/* Make buttons INSIDE the mobile menu visible on mobile */
.taskbar-mobile-menu .taskbar-button{
  display:block !important;
  width:calc(100% - 8px);
  margin:4px;
  text-align:left;
  padding:12px 16px;
  font-size:14px;
}
.taskbar-mobile-menu .taskbar-separator{
  display:none;
}

/* Mobile responsive styles */
@media screen and (max-width: 768px) {
  .win98-taskbar{overflow-x:visible;flex-wrap:nowrap}
  .taskbar-hamburger{display:inline-block}
  .win98-taskbar > .taskbar-button{display:none}
  .taskbar-separator{display:none}
  .taskbar-start{font-size:11px;padding:4px 8px;margin-right:4px}
  .taskbar-counter{font-size:10px;padding:4px 6px}
}

/* Small mobile devices */
@media screen and (max-width: 480px) {
  .win98-taskbar{height:36px}
  .taskbar-start{font-size:10px;padding:3px 6px}
  .taskbar-counter{font-size:9px;padding:3px 5px}
  .taskbar-hamburger{padding:4px 8px;font-size:14px}
  .taskbar-mobile-menu{
    bottom:36px;
    max-height:calc(100vh - 36px);
  }
}
</style>

<script>
(function(){
  var menuBtn    = document.getElementById('taskbar-menu-btn');
  var mobileMenu = document.getElementById('taskbar-mobile-menu');

  if (!menuBtn || !mobileMenu) return;

  function closeMenu() {
    mobileMenu.classList.remove('open');
    menuBtn.classList.remove('is-open');
  }

  menuBtn.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    mobileMenu.classList.toggle('open');
    menuBtn.classList.toggle('is-open');
  });

  document.addEventListener('click', function(e) {
    if (!mobileMenu.contains(e.target) && !menuBtn.contains(e.target)) {
      closeMenu();
    }
  });

  mobileMenu.querySelectorAll('a').forEach(function(link) {
    link.addEventListener('click', closeMenu);
  });
})();
</script>
