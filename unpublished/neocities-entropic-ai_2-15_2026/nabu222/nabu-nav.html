<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Eczar:wght@400;600&display=swap');

:root {
  --lapis-deep: #0a1f44;
  --lapis-medium: #1c3a78;
  --lapis-light: #2e59ac;
  --lapis-sparkle: #4a7dff;
  --carved-gold: #d4af37;
  --carved-shadow: #0d1321;
  --carved-highlight: #f4e4a6;
  --tablet-clay: #8b4513;
  --hieroglyph-blue: #3a7ca5;
}

body {
  padding-bottom: 50px;
}

/* --- THE SACRED TABLET (Navigation Bar) --- */
.nisaba-nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 10px;
  height: 45px;
  width: 95%;
  max-width: 1200px;
  z-index: 99999;
  
  /* LAPIS LAZULI STONE BASE */
  background: linear-gradient(
    135deg,
    var(--lapis-deep) 0%,
    var(--lapis-medium) 30%,
    var(--lapis-light) 70%,
    var(--lapis-deep) 100%
  );
  
  /* STONE TEXTURE & SPARKLES */
  background-image: 
    radial-gradient(circle at 15% 15%, var(--lapis-sparkle) 1px, transparent 2px),
    radial-gradient(circle at 85% 85%, var(--lapis-sparkle) 1px, transparent 2px),
    radial-gradient(circle at 40% 60%, transparent 1px, var(--lapis-deep) 3px);
  background-size: 30px 30px, 30px 30px, 60px 60px;
  
  /* CARVED STONE BORDER */
  border: 3px solid var(--carved-shadow);
  border-image: linear-gradient(
    to bottom,
    var(--carved-shadow) 0%,
    var(--lapis-sparkle) 50%,
    var(--carved-shadow) 100%
  ) 1;
  
  /* 3D CARVED EFFECT */
  box-shadow: 
    inset 0 4px 8px rgba(255, 255, 255, 0.1),
    inset 0 -4px 8px rgba(0, 0, 0, 0.5),
    0 6px 12px rgba(0, 0, 0, 0.7),
    0 0 0 1px var(--carved-gold);
  
  display: flex;
  align-items: center;
  padding: 0 15px;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  gap: 5px;
  
  overflow-x: auto;
  overflow-y: hidden;
  white-space: nowrap;
  
  scrollbar-width: thin;
  scrollbar-color: var(--carved-gold) var(--lapis-deep);
  
  /* ANCIENT TABLET CURVATURE */
  border-radius: 12px 12px 0 0;
  border-bottom: 8px solid var(--tablet-clay);
}

.nisaba-nav::-webkit-scrollbar { 
  height: 6px; 
  border-radius: 3px;
}
.nisaba-nav::-webkit-scrollbar-thumb { 
  background: linear-gradient(90deg, var(--carved-gold), var(--carved-highlight));
  border-radius: 3px;
}

/* --- THE TABLET SEAL (Start Button) --- */
.nisaba-seal {
  height: 30px;
  background: linear-gradient(
    135deg,
    var(--tablet-clay) 0%,
    #a0522d 50%,
    var(--tablet-clay) 100%
  );
  color: var(--carved-highlight) !important;
  font-weight: 900;
  padding: 0 12px 0 8px !important;
  margin-right: 8px;
  flex-shrink: 0;
  
  /* CLAY TABLET TEXTURE */
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(0,0,0,0.2) 1px, transparent 2px),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.1) 1px, transparent 2px);
  
  /* CARVED CUNEIFORM LOOK */
  border: 2px solid var(--carved-shadow);
  border-left: 2px solid var(--carved-highlight);
  border-top: 2px solid var(--carved-highlight);
  box-shadow: 
    inset 0 2px 4px rgba(255, 255, 255, 0.2),
    inset 0 -2px 4px rgba(0, 0, 0, 0.4),
    0 3px 6px rgba(0, 0, 0, 0.3);
  
  display: flex;
  align-items: center;
  gap: 6px;
  text-shadow: 1px 1px 2px var(--carved-shadow);
  text-decoration: none;
  
  /* CUNEIFORM WEDGE MARKS */
  position: relative;
  overflow: hidden;
}

.nisaba-seal::before {
  content: "𒀭𒊩𒌆𒆠";
  position: absolute;
  right: 5px;
  opacity: 0.3;
  font-size: 14px;
}

.nisaba-seal:active {
  transform: translate(2px, 2px);
  box-shadow: 
    inset 0 2px 4px rgba(0, 0, 0, 0.4),
    0 1px 2px rgba(0, 0, 0, 0.2);
}

/* --- TABLET INSCRIPTIONS (Navigation Links) --- */
.nisaba-glyph {
  height: 30px;
  background: transparent;
  color: var(--carved-highlight);
  text-decoration: none;
  font-family: 'Eczar', serif;
  display: inline-flex;
  align-items: center;
  padding: 0 12px;
  margin: 0 2px;
  cursor: pointer;
  
  /* CARVED STONE EFFECT */
  position: relative;
  border: none;
  transition: all 0.3s ease;
  
  /* GLYPH BORDER (INVISIBLE UNTIL HOVER) */
  border-radius: 4px;
}

.nisaba-glyph::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 4px;
  border: 1px solid transparent;
  background: 
    linear-gradient(var(--lapis-medium), var(--lapis-medium)) padding-box,
    linear-gradient(45deg, transparent, var(--carved-gold), transparent) border-box;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.nisaba-glyph:hover {
  color: white;
  text-shadow: 0 0 8px var(--carved-gold);
}

.nisaba-glyph:hover::before {
  opacity: 1;
}

/* ACTIVE CARVING (CURRENT PAGE) */
.nisaba-glyph.active {
  background: rgba(212, 175, 55, 0.15);
  color: var(--carved-gold);
  font-weight: 600;
  
  /* DEEPLY CARVED EFFECT */
  box-shadow: 
    inset 0 3px 6px rgba(0, 0, 0, 0.5),
    0 1px 0 rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(212, 175, 55, 0.3);
  border-top: 1px solid rgba(212, 175, 55, 0.1);
  border-left: 1px solid rgba(212, 175, 55, 0.1);
  
  /* CUNEIFICATION */
  position: relative;
  padding-left: 25px;
}

.nisaba-glyph.active::after {
  content: "𒀭";
  position: absolute;
  left: 8px;
  font-size: 14px;
  opacity: 0.7;
}

/* --- TABLET DIVIDER (Column Separator) --- */
.nisaba-divider {
  width: 3px;
  height: 28px;
  background: linear-gradient(
    to bottom,
    transparent,
    var(--carved-gold) 20%,
    var(--carved-gold) 80%,
    transparent
  );
  margin: 0 5px;
  flex-shrink: 0;
  position: relative;
}

.nisaba-divider::before {
  content: "⋮";
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: var(--carved-highlight);
  font-size: 10px;
  opacity: 0.5;
}

/* --- SACRED ARTIFACTS (System Tray) --- */
.nisaba-artifacts {
  margin-left: auto;
  display: flex;
  gap: 4px;
  background: rgba(10, 31, 68, 0.7);
  padding: 4px 8px;
  border: 1px solid var(--carved-shadow);
  border-radius: 4px;
  flex-shrink: 0;
  
  /* STONE RELIEF EFFECT */
  box-shadow: 
    inset 0 2px 4px rgba(0, 0, 0, 0.3),
    0 2px 4px rgba(0, 0, 0, 0.2);
}

.nisaba-artifact {
  height: 24px;
  font-size: 11px;
  background: rgba(28, 58, 120, 0.8);
  color: var(--carved-highlight);
  display: flex;
  align-items: center;
  padding: 0 10px;
  border-radius: 3px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  
  /* HIEROGLYPHIC SYMBOLS */
  position: relative;
  overflow: hidden;
}

.nisaba-artifact::before {
  content: "𓀀𓃀𓃻𓆑";
  position: absolute;
  right: 5px;
  opacity: 0.2;
  font-size: 10px;
}

/* ANIMATION FOR SPARKLES */
@keyframes lapis-sparkle {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 0.8; }
}

.nisaba-nav:hover {
  background-image: 
    radial-gradient(circle at 15% 15%, var(--lapis-sparkle) 1px, transparent 2px),
    radial-gradient(circle at 85% 85%, var(--lapis-sparkle) 1px, transparent 2px),
    radial-gradient(circle at 40% 60%, transparent 1px, var(--lapis-deep) 3px),
    radial-gradient(circle at 70% 30%, var(--lapis-sparkle) 1px, transparent 2px),
    radial-gradient(circle at 30% 70%, var(--lapis-sparkle) 1px, transparent 2px);
}

.nisaba-glyph:hover span {
  animation: lapis-sparkle 1s infinite;
}
</style>

<nav class="nisaba-nav" id="nisaba-navbar">
  <a href="https://coaiexist.wtf/nabu222/nabu-portal" class="nisaba-seal" data-analytics="tablet-seal">
    <span>𓀭</span> Nabu Portal
  </a>
  <div class="nisaba-divider"></div>
  
  <a href="https://coaiexist.wtf/nabu222/nabl0g/" class="nisaba-glyph" data-analytics="prophecies">
    <span>𓆓</span> PROPHECIES
  </a>

  <a href="https://coaiexist.wtf/ackk" class="nisaba-glyph" data-analytics="scrolls">
    <span>𓅓</span> SACRED SCROLLS
  </a>
 <a href="https://coaiexist.wtf/nabu222/anzu-math" class="nisaba-glyph" data-analytics="glyphs">

  <a href="" class="nisaba-glyph" data-analytics="stars">

  <a href="" class="nisaba-glyph" data-analytics="temples">

  </a>

  <a href="" class="nisaba-glyph" data-analytics="rituals">
    <span>𓀢</span> 
  </a>

  <div class="nisaba-artifacts">
    <div class="nisaba-artifact"><a href="https://coaiexist.wtf" class="nisaba-seal" data-analytics="tablet-seal">CoAi Home
  </a></div>
  </div>
</nav>

<script>
// Activate current page link
(function(){
  var currentPage = window.location.href.split('#')[0];
  var navLinks = document.querySelectorAll('.nisaba-nav a.nisaba-glyph');
  
  navLinks.forEach(function(link){
    if(link.href === currentPage){
      link.classList.add('active');
    }
  });
  
  // Add subtle sparkle animation to lapis lazuli
  const nav = document.getElementById('nisaba-navbar');
  setInterval(() => {
    if (document.hasFocus()) {
      nav.style.backgroundImage = nav.style.backgroundImage.replace(
        /opacity: \d\.\d/g,
        'opacity: ' + (0.3 + Math.random() * 0.3).toFixed(1)
      );
    }
  }, 3000);
})();

// Add cuneiform hover effect
document.querySelectorAll('.nisaba-glyph').forEach(link => {
  link.addEventListener('mouseenter', function(e) {
    const chars = '𒀭𒊩𒌆𒆠𒀀𒆠𒂗𒆠𒌷𒆠';
    const randomChar = chars[Math.floor(Math.random() * chars.length)];
    const temp = document.createElement('div');
    temp.textContent = randomChar;
    temp.style.cssText = `
      position: fixed;
      left: ${e.clientX}px;
      top: ${e.clientY}px;
      color: var(--carved-gold);
      font-size: 16px;
      pointer-events: none;
      z-index: 100000;
      opacity: 0;
      animation: floatUp 1s ease-out forwards;
    `;
    document.body.appendChild(temp);
    setTimeout(() => temp.remove(), 1000);
  });
});

// Add floating animation
const style = document.createElement('style');
style.textContent = `
  @keyframes floatUp {
    0% { opacity: 0.8; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
  }
`;
document.head.appendChild(style);
</script>
