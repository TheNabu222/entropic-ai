<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NABU // GOD MODE POSTER</title>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-green: #00ff00;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--neon-blue);
            font-family: 'Orbitron', sans-serif;
            padding: 20px;
        }

        .god-container {
            max-width: 1000px;
            margin: 0 auto;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            padding: 20px;
            background: rgba(0,0,0,0.9);
        }

        h1 { text-align: center; text-shadow: 0 0 10px var(--neon-blue); margin-bottom: 30px; letter-spacing: 5px; }

        /* --- PANELS --- */
        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        @media (max-width: 700px) { .control-grid { grid-template-columns: 1fr; } }

        .panel {
            border: 1px solid #333;
            padding: 15px;
            background: #0a0a0a;
        }
        .panel-title { color: var(--neon-pink); font-size: 0.8em; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }

        /* --- INPUTS --- */
        input[type="text"], select {
            width: 100%;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 10px;
            font-family: 'VT323', monospace;
            font-size: 1.2em;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        input:focus, select:focus { outline: none; border-color: var(--neon-green); }

        /* --- CHECKBOXES --- */
        .target-options { display: flex; gap: 15px; flex-wrap: wrap; }
        .target-label {
            display: flex; align-items: center; gap: 5px; cursor: pointer;
            border: 1px solid #444; padding: 5px 10px; transition: 0.2s;
        }
        .target-label:hover { border-color: var(--neon-blue); }
        input[type="checkbox"] { accent-color: var(--neon-pink); }

        /* --- CRITICAL EDITOR FIX --- */
        #editor-wrapper {
            background: #fff;
            color: #000; /* FORCE BLACK TEXT */
            border: 1px solid #ccc;
        }
        /* Override any global styles that might make text invisible */
        .ql-editor {
            min-height: 250px;
            font-family: sans-serif;
            font-size: 16px;
            color: #000 !important;
            background: #fff !important;
        }
        .ql-toolbar {
            background: #eee;
            border-bottom: 1px solid #ccc;
        }

        /* --- FALLBACK TEXTAREA (Hidden by default) --- */
        #fallback-editor {
            width: 100%;
            height: 300px;
            background: #fff;
            color: #000;
            font-family: monospace;
            padding: 10px;
            display: none;
        }

        /* --- ACTION BAR --- */
        .action-bar {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 2px solid #333;
            padding-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .big-btn {
            background: var(--neon-blue);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.2em;
            padding: 15px 40px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-blue);
            transition: 0.3s;
        }
        .big-btn:hover { background: #fff; box-shadow: 0 0 30px #fff; transform: scale(1.05); }

        .toggle-btn { background: #333; color: #aaa; border: none; padding: 5px 10px; cursor: pointer; font-size: 0.8em; }

        /* --- STATUS LOG --- */
        #status-log {
            margin-top: 20px;
            font-family: 'VT323', monospace;
            color: var(--neon-green);
            height: 100px;
            overflow-y: auto;
            border: 1px solid #333;
            padding: 10px;
            font-size: 1.2em;
            background: #000;
        }
    </style>
</head>
<body>

<div class="god-container">
    <h1>⚡️ MASTER CONTROL ⚡️</h1>

    <div class="control-grid">
        <div class="panel">
            <div class="panel-title">1. Transmission Data</div>
            <input type="text" id="post-title" placeholder="Headline / Title...">
            
            <div class="panel-title" style="margin-top:10px;">Category</div>
            <select id="post-category">
                <option value="update">✨ Update</option>
                <option value="artwork">🎨 Artwork</option>
                <option value="poetry">📝 Poetry</option>
                <option value="blog">💭 Deep Thoughts</option>
                <option value="video">🎥 Video/Media</option>
            </select>
        </div>

        <div class="panel">
            <div class="panel-title">2. Target Destinations</div>
            <div class="target-options">
                <label class="target-label"><input type="checkbox" name="target" value="main" checked> 🌐 Main Site</label>
                <label class="target-label"><input type="checkbox" name="target" value="nabu_os" checked> 💻 Nabu OS</label>
                <label class="target-label"><input type="checkbox" name="target" value="blog"> 📜 Nabl0g</label>
            </div>
            
            <div class="panel-title" style="margin-top:20px;">3. Aesthetic Protocol</div>
            <select id="card-style">
                <option value="glass">💎 Neon Glass (Standard)</option>
                <option value="terminal">📟 Retro Terminal (Green/Black)</option>
                <option value="y2k">💖 Y2K Glitch (Pink/Plastic)</option>
                <option value="paper">📜 Parchment (Minimal)</option>
            </select>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title" style="display:flex; justify-content:space-between;">
            4. The Content
            <button class="toggle-btn" onclick="toggleFallback()">Broken Editor? Click Here</button>
        </div>
        
        <div id="editor-wrapper">
            <div id="editor-container"></div>
        </div>

        <textarea id="fallback-editor" placeholder="Write HTML or raw text here if the fancy editor is broken..."></textarea>
    </div>

    <div class="panel" style="margin-top: 20px;">
        <div class="panel-title">5. Embedded Media (Optional)</div>
        <div style="display:flex; gap:10px; flex-wrap: wrap;">
            <select id="media-type" style="width: 150px;">
                <option value="none">No Media</option>
                <option value="youtube">YouTube</option>
                <option value="soundcloud">SoundCloud</option>
                <option value="image">Image/GIF URL</option>
            </select>
            <input type="text" id="media-url" placeholder="Paste URL or ID here..." style="flex-grow:1; margin-bottom:0;">
        </div>
    </div>

    <div class="action-bar">
        <div style="color:#666; font-size:0.8em;">USER: NABU // AUTH: VERIFIED</div>
        <button class="big-btn" onclick="broadcast()">BROADCAST SIGNAL</button>
    </div>

    <div id="status-log">Initializing...</div>
</div>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    // --- VARIABLES ---
    let quill;
    let useFallback = false;
    const logBox = document.getElementById('status-log');

    // --- LOGGING ---
    function log(msg) {
        logBox.innerHTML += `<div>> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // --- INITIALIZATION ---
    window.onload = function() {
        log("System Loaded.");

        // 1. Initialize Quill
        try {
            quill = new Quill('#editor-container', {
                theme: 'snow',
                placeholder: 'Type your transmission...',
                modules: { toolbar: [ ['bold', 'italic', 'underline', 'code-block'], [{ 'color': [] }, { 'background': [] }], ['link', 'clean'] ] }
            });
            log("✅ Editor Loaded Successfully.");
        } catch (e) {
            log("⚠️ Editor Error: " + e.message);
            toggleFallback(); // Switch to fallback automatically if crash
        }

        // 2. Initialize Supabase
        initSupabase();
    };

    // --- SUPABASE SETUP ---
    const SB_URL = 'https://aqxrogaltuwtlparwdkq.supabase.co';
    const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxeHJvZ2FsdHV3dGxwYXJ3ZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxMDY0NzAsImV4cCI6MjA3NzY4MjQ3MH0.qvkQaoQa7MaN7drGHKGxU3c1KnTQOdTH022MynR6fzI';
    let supabase;

    async function initSupabase() {
        try {
            supabase = window.supabase.createClient(SB_URL, SB_KEY);
            // Ghost Login
            const { error } = await supabase.auth.signInWithPassword({ 
                email: 'nabu@coaiexist.wtf', 
                password: '!Bc7f2a!' 
            });
            if(error) log("⚠️ Auth Warning (You might be logged out): " + error.message);
            else log("✅ Authenticated as Nabu.");
        } catch (e) {
            log("❌ Supabase Crash: " + e.message);
        }
    }

    // --- FALLBACK MODE ---
    function toggleFallback() {
        useFallback = !useFallback;
        if(useFallback) {
            document.getElementById('editor-wrapper').style.display = 'none';
            document.getElementById('fallback-editor').style.display = 'block';
            log("Switched to RAW TEXT mode.");
        } else {
            document.getElementById('editor-wrapper').style.display = 'block';
            document.getElementById('fallback-editor').style.display = 'none';
            log("Switched to RICH EDITOR mode.");
        }
    }

    // --- BROADCAST FUNCTION ---
    async function broadcast() {
        if(!supabase) { alert("Database not connected! Refresh page."); return; }

        log("Initiating Broadcast...");

        const title = document.getElementById('post-title').value;
        const category = document.getElementById('post-category').value;
        
        // Get content from Quill OR Fallback
        let content;
        if(useFallback) {
            content = document.getElementById('fallback-editor').value.replace(/\n/g, '<br>');
        } else {
            content = quill.root.innerHTML;
        }

        const targets = Array.from(document.querySelectorAll('input[name="target"]:checked')).map(cb => cb.value);
        const stylePreset = document.getElementById('card-style').value;
        const mediaType = document.getElementById('media-type').value;
        let mediaUrl = document.getElementById('media-url').value;
        
        // YouTube cleanup
        if(mediaType === 'youtube') {
            if(mediaUrl.includes('v=')) mediaUrl = mediaUrl.split('v=')[1].split('&')[0];
            else if(mediaUrl.includes('youtu.be/')) mediaUrl = mediaUrl.split('youtu.be/')[1];
        }

        const payload = {
            title: title,
            category: category,
            content: content,
            target_feeds: targets,
            card_style: stylePreset,
            media_type: mediaType,
            media_url: mediaUrl,
            published: true,
            featured: false
        };

        const { error } = await supabase.from('personal_updates').insert([payload]);

        if(error) {
            log("❌ UPLOAD FAILED: " + error.message);
            alert("Error: " + error.message);
        } else {
            log("✅ TRANSMISSION SUCCESSFUL!");
            // Reset
            document.getElementById('post-title').value = '';
            if(!useFallback) quill.setContents([]);
            document.getElementById('fallback-editor').value = '';
        }
    }
</script>
</body>
</html>
