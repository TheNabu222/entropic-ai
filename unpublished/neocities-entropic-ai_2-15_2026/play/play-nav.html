<!-- playwave Navigation Bar - Single File Version -->
<style>
@import url('https://fonts.googleapis.com/css2?family=VT323&family=Roboto:wght@300;400;700&display=swap');

:root{--play-pink:#ff71ce;--play-purple:#b967ff;--play-cyan:#01cdfe;--play-blue:#05ffa1;--play-yellow:#fffb96;--play-dark:#0a0e27}
body{padding-bottom:65px;background:linear-gradient(180deg,#0a0e27 0%,#1a1f45 100%)}
.play-nav{position:fixed;left:0;right:0;bottom:0;height:55px;z-index:9999;background:linear-gradient(180deg,rgba(255,113,206,0.95) 0%,rgba(185,103,255,0.95) 50%,rgba(1,205,254,0.95) 100%);border-top:3px solid var(--play-yellow);box-shadow:0 -4px 30px rgba(255,113,206,0.6),0 -2px 15px rgba(1,205,254,0.4),inset 0 2px 0 rgba(255,255,255,0.5);display:flex;align-items:center;padding:0 10px;font-family:'Roboto',sans-serif;font-size:13px;gap:8px;overflow-x:auto;overflow-y:hidden}
.play-nav::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background-image:linear-gradient(rgba(255,255,255,0.1) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.1) 1px,transparent 1px);background-size:30px 30px;pointer-events:none}
.play-nav::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,0.03) 2px,rgba(255,255,255,0.03) 4px);pointer-events:none}
.play-btn{background:linear-gradient(135deg,rgba(255,255,255,0.9) 0%,rgba(232,245,255,0.8) 100%);border:2px solid rgba(255,255,255,0.8);padding:6px 16px;cursor:pointer;color:var(--play-purple);text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;transition:all 0.3s ease;white-space:nowrap;position:relative;box-shadow:0 4px 8px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,1);text-shadow:0 1px 2px rgba(255,255,255,0.8)}
.play-btn:hover{background:linear-gradient(135deg,rgba(255,251,150,1) 0%,rgba(255,113,206,0.9) 100%);color:var(--play-dark);border-color:var(--play-yellow);transform:translateY(-3px);box-shadow:0 6px 20px rgba(255,113,206,0.6),0 0 20px rgba(255,251,150,0.4),inset 0 1px 0 rgba(255,255,255,1)}
.play-btn.active{background:linear-gradient(135deg,rgba(255,251,150,1) 0%,rgba(1,205,254,0.95) 100%);color:var(--play-dark);border-color:var(--play-yellow);box-shadow:0 0 25px rgba(1,205,254,0.8),0 4px 15px rgba(255,251,150,0.6),inset 0 1px 0 rgba(255,255,255,1);animation:play-glow 2s ease-in-out infinite}
@keyframes play-glow{0%,100%{box-shadow:0 0 25px rgba(1,205,254,0.8),0 4px 15px rgba(255,251,150,0.6),inset 0 1px 0 rgba(255,255,255,1)}50%{box-shadow:0 0 35px rgba(255,113,206,1),0 4px 20px rgba(185,103,255,0.8),inset 0 1px 0 rgba(255,255,255,1)}}
.play-start{background:linear-gradient(135deg,rgba(255,251,150,1) 0%,rgba(255,113,206,1) 50%,rgba(185,103,255,1) 100%);color:#fff;font-weight:900;padding:10px 20px;font-family:'VT323',monospace;font-size:16px;border:3px solid rgba(255,255,255,0.9);box-shadow:0 6px 20px rgba(255,113,206,0.8),0 0 30px rgba(185,103,255,0.6),inset 0 2px 0 rgba(255,255,255,0.5);text-shadow:2px 2px 4px rgba(0,0,0,0.5)}
.play-sep{width:3px;height:40px;background:linear-gradient(180deg,rgba(255,255,255,0.8) 0%,var(--play-yellow) 50%,rgba(255,255,255,0.8) 100%);box-shadow:0 0 10px rgba(255,251,150,0.6);margin:0 6px;flex-shrink:0;border-radius:2px}
.play-title{background:linear-gradient(135deg,rgba(255,255,255,0.95) 0%,rgba(232,245,255,0.9) 100%);color:var(--play-purple);padding:10px 20px;font-weight:900;font-family:'VT323',monospace;font-size:16px;letter-spacing:2px;border:3px solid rgba(255,255,255,1);margin:0 8px;white-space:nowrap;text-shadow:2px 2px 0 var(--play-pink);box-shadow:0 4px 15px rgba(255,113,206,0.5),0 0 20px rgba(1,205,254,0.3),inset 0 2px 0 rgba(255,255,255,1)}
.play-back{background:linear-gradient(135deg,rgba(1,205,254,0.95) 0%,rgba(5,255,161,0.9) 100%);color:var(--play-dark);border-color:rgba(255,255,255,0.9)}
.play-extra{background:linear-gradient(135deg,rgba(255,113,206,0.95) 0%,rgba(255,251,150,0.9) 100%);color:var(--play-dark)}
</style>

<nav class="play-nav" id="play-navbar">
  <a href="https://coaiexist.wtf/play/games-portal" class="play-btn play-start" data-goatcounter-click="nav-start">⊞ START</a>
  <div class="play-sep"></div>
  <a href="https://coaiexist.wtf" class="play-btn play-back" data-goatcounter-click="nav-main-site">↩ MAIN SITE</a>
  <div class="play-sep"></div>

  <div class="play-sep"></div>
  <a href="https://coaiexist.wtf/nabu222/ai_therapist.html" class="play-btn" data-goatcounter-click="nav-ai-therapy"><span>🏬AI THERAPY</span></a>
  <a href="https://coaiexist.wtf/hd_tv/hdtv" class="play-btn" data-goatcounter-click="nav-hdtv"><span>🌴HD.TV</span></a>
  <a href="https://coaiexist.wtf/play/ecosim.html" class="play-btn" data-goatcounter-click="nav-ecosim"><span>🕹️ECOSI</span></a>
  <a href="https://coaiexist.wtf/bc7f2a/terminal_temple.html" class="play-btn" data-goatcounter-click="nav-terminal-temple"><span>💿TERMINAL TEMPLE</span></a>
  <a href="https://coaiexist.wtf/hd_tv/dragndrop" class="play-btn" data-goatcounter-click="nav-scenemaker"><span>🎨SCENEMAKER</span></a>
  <a href="https://coaiexist.wtf/maps/void_explorer" class="play-btn play-extra" data-goatcounter-click="nav-void-3d"><span> 🌑VOI.3D</span></a>
  <a href="https://coaiexist.wtf/play/cavebot/cavebot1/ttrpg/" class="play-btn play-extra" data-goatcounter-click="nav-cavebot-demo"><span>〰️CAVEBOT DEMO</span></a>
  <a href="https://coaiexist.wtf/maps/gateway" class="play-btn play-extra" data-goatcounter-click="nav-ascii-maps"><span>🗺ASCII MAPS</span></a>
</nav>

<script>
(function(){
  var here = location.pathname.replace(/\/+$/,'');
  document.querySelectorAll('.play-nav a.play-btn:not(.play-start):not(.play-back)').forEach(function(a){
    try{
      var p = new URL(a.href).pathname.replace(/\/+$/,'');
      if(p && p === here) a.classList.add('active');
    }catch(e){}
  });
})();
</script>
