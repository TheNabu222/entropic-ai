<style>
/* ==================================================================
== THE ASTRAL GUESTBOOK - A STANDALONE ARTIFACT             ==
==================================================================
*/

:root {
    --magenta: #f312af;
    --cyan: #00ffcc;
    --yellow: #fffb01;
    --purple: #bf5fff;
}

/* --- THE ATMOSPHERE: A LIVING STARFIELD --- */
@keyframes move-twinkle-back { from {background-position:0 0;} to {background-position:-10000px 5000px;} }

body {
    margin: 0;
    padding: 20px;
    background: #000;
    color: var(--cyan);
    font-family: 'VT323', monospace;
    font-size: 18px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    box-sizing: border-box;

    /* Starfield Background */
    background: url(https://www.transparenttextures.com/patterns/stardust.png) #000;
    animation: move-twinkle-back 200s linear infinite;
}

/* --- THE ARTIFACT: A COSMIC TABLET --- */
.cosmic-tablet {
    width: 95%;
    max-width: 900px;
    background-color: #0c0a14;
    border: 2px solid var(--purple);
    border-radius: 10px;

    /* The glowing crystal effect */
    box-shadow: 0 0 15px var(--purple),
                0 0 30px var(--magenta),
                inset 0 0 10px rgba(243, 18, 175, 0.5);

    padding: 20px 30px;
    text-align: center;
}

.tablet-header h1 {
    font-family: 'Uncial Antiqua', cursive; /* A more mystical font */
    font-size: 4rem;
    color: var(--yellow);
    text-shadow: 0 0 5px var(--yellow), 0 0 15px var(--magenta);
    margin: 10px 0;
    letter-spacing: 3px;
}

.tablet-header p {
    font-size: 1.3rem;
    color: #fff;
    margin-bottom: 25px;
}

/* --- THE PORTAL: CUSTOM GUESTBOOK --- */
.guestbook-portal {
    margin-top: 20px;
}

/* Override some guestbook widget styles to match cosmic theme */
.guestbook-widget .guestbook-form,
.guestbook-widget .guestbook-entries {
    background: linear-gradient(135deg, #0c0a14 0%, #04080f 100%);
}

.admin-link {
    display: block;
    margin-top: 2rem;
    padding: 1rem;
    background: rgba(0, 255, 204, 0.1);
    border: 2px solid var(--cyan);
    border-radius: 8px;
    color: var(--cyan);
    text-decoration: none;
    font-size: 1.1rem;
    transition: all 0.3s ease;
}

.admin-link:hover {
    background: rgba(0, 255, 204, 0.2);
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
    transform: translateY(-2px);
}
#bonzi-container {
    position: fixed;
    bottom: 40px;
    right: 10px;
    width: 200px;
    height: 200px;
    z-index: 9999;
    cursor: pointer;
    filter: drop-shadow(0 0 10px #f312af); /* Using the magenta variable color */
}

#bonzi-container canvas {
    pointer-events: auto;
}

#pip-receipt {
    position: absolute;
    bottom: 150px;
    left: 50%;
    transform: translateX(-50%) rotate(-5deg);
    background-color: #f0f0f0;
    color: #333;
    font-family: 'VT323', monospace;
    font-size: 16px;
    padding: 8px 12px;
    border: 2px dashed #555;
    white-space: pre-wrap;
    text-align: center;
    width: 180px;
    opacity: 0;
    transition: opacity 0.3s ease-out;
    pointer-events: none;
    z-index: 1001;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
}

#pip-receipt.visible {
    opacity: 1;
}

/* Mobile adjustments */
@media (max-width: 768px) {
    #bonzi-container {
        width: 120px;
        height: 120px;
        bottom: 45px;
        right: 5px;
    }
    #pip-receipt {
        bottom: 100px;
        font-size: 12px;
        width: 140px;
    }
}

<body>

    <main class="cosmic-tablet">
        <header class="tablet-header">

        </header>

        <div class="guestbook-portal">

            <noscript>A signal is required to view these inscriptions. Please enable JavaScript.</noscript>
        </div>

    </main>

<div id="taskbar"></div>

<script src="js/guestbook.js?v=2"></script>

<iframe src="/nav.html" 
        style="position:fixed;bottom:0;left:0;width:100%;height:50px;border:none;z-index:9999;">
</iframe><div id="bonzi-container"></div>
<div id="pip-receipt">AUTH: UNVERIFIED</div><script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import * as Tone from 'https://cdn.skypack.dev/tone';

const container = document.getElementById('bonzi-container');
const receiptEl = document.getElementById('pip-receipt');

// Scene Setup
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 2.0));
const dirLight = new THREE.DirectionalLight(0xffffff, 4);
dirLight.position.set(5, 10, 7.5);
scene.add(dirLight);

const loader = new GLTFLoader();
const clock = new THREE.Clock();
let buddies = {};
let currentBuddy = null;
let isClickAnimationPlaying = false;

// Assets
const modelPaths = {
    stand: 'https://coaiexist.wtf/assets/pollywog/pip_stand.glb',
    walk: 'https://coaiexist.wtf/assets/pollywog/pip_walk.glb',
    jump: 'https://coaiexist.wtf/assets/pollywog/pip_jump.glb',
    skill: 'https://coaiexist.wtf/assets/pollywog/pip_skill.glb',
    wave: 'https://coaiexist.wtf/assets/pollywog/pip_wave.glb',
    jazz: 'https://coaiexist.wtf/assets/pollywog/pip_jazz.glb'
};

const modelPromises = Object.entries(modelPaths).map(([name, path]) => {
    return new Promise((resolve) => {
        loader.load(path, (gltf) => {
            const model = gltf.scene;
            const mixer = new THREE.AnimationMixer(model);
            const action = mixer.clipAction(gltf.animations[0]);
            action.setLoop(THREE.LoopOnce);
            action.clampWhenFinished = true;
            model.scale.set(45, 45, 45);
            model.position.y = -60;
            model.visible = false;
            scene.add(model);
            buddies[name] = { model, mixer, action, name };
            resolve();
        });
    });
});

// Audio setup
const boopSynth = new Tone.Synth().toDestination();
const receiptSynth = new Tone.NoiseSynth().toDestination();

container.addEventListener('click', () => {
    Tone.start();
    if (!isClickAnimationPlaying) {
        playSpecificAnimation('wave');
        showRandomReceipt();
        boopSynth.triggerAttackRelease("C5", "8n");
    }
});

const receipts = ["AUTH: UNVERIFIED", "pip install princess", "KIDZBOP DID 9/11", "Not for profit, \n but for propht."];

function showRandomReceipt() {
    receiptEl.textContent = receipts[Math.floor(Math.random() * receipts.length)];
    receiptEl.classList.add('visible');
    receiptSynth.triggerAttackRelease("16n");
    setTimeout(() => receiptEl.classList.remove('visible'), 3000);
}

function playAnimation(name) {
    if (currentBuddy) {
        currentBuddy.model.visible = false;
        currentBuddy.action.stop();
    }
    currentBuddy = buddies[name];
    currentBuddy.model.visible = true;
    currentBuddy.action.reset().play();
    return currentBuddy.action.getClip().duration * 1000;
}

function playSpecificAnimation(name) {
    isClickAnimationPlaying = true;
    const duration = playAnimation(name);
    setTimeout(() => {
        isClickAnimationPlaying = false;
        playIdleAnimation();
    }, duration);
}

function playIdleAnimation() {
    if (isClickAnimationPlaying) return;
    const idleAnimations = ['stand', 'walk', 'jump'];
    const randomIdle = idleAnimations[Math.floor(Math.random() * idleAnimations.length)];
    const duration = playAnimation(randomIdle);
    setTimeout(playIdleAnimation, duration + Math.random() * 4000 + 3000);
}

Promise.all(modelPromises).then(() => {
    camera.position.set(0, 0, 100);
    playIdleAnimation();
    animate();
});

function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (currentBuddy) currentBuddy.mixer.update(delta);
    renderer.render(scene, camera);
}
</script>
</body>
