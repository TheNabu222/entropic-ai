<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Write to Blog</title>
  <style>
    body { background: #111; color: #ddd; font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 15px; margin-bottom: 15px; font-size: 1.1rem; }
    textarea { height: 200px; resize: vertical; }
    button { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1.2rem; }
    button:hover { background: #fff; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h2>Write to Blog</h2>
  <input type="text" id="title" placeholder="Post Title">
  <textarea id="content" placeholder="What's on your mind?"></textarea>
  <button onclick="publish()">POST</button>

  <script>
    // ⚡️ FIXED: We call this 'client' instead of 'supabase' to avoid the crash
    const client = supabase.createClient('https://aqxrogaltuwtlparwdkq.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxeHJvZ2FsdHV3dGxwYXJ3ZGtxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjIxMDY0NzAsImV4cCI6MjA3NzY4MjQ3MH0.qvkQaoQa7MaN7drGHKGxU3c1KnTQOdTH022MynR6fzI')

    async function publish() {
      const title = document.getElementById('title').value
      const content = document.getElementById('content').value
      
      if (!title || !content) {
        alert("Please write something first!");
        return;
      }

      const { error } = await client
        .from('nabl0g')
        .insert([{ title: title, content: content, tags: 'blog' }])

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert("Posted successfully! ⚡️");
        document.getElementById('title').value = '';
        document.getElementById('content').value = '';
      }
    }
  </script>
</body>
</html>
